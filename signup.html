<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원가입 - SAP 1기</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="assets/js/tailwind-config.js"></script>
<link href="assets/css/app.css" rel="stylesheet">
</head>
<body class="text-on-surface min-h-screen flex items-center justify-center px-4 py-10">
<div class="mesh-bg"></div>
<div class="w-full max-w-md glass-panel rounded-[2rem] p-8">
  <div class="text-center mb-8">
    <div class="w-10 h-10 bg-gradient-to-br from-primary-container to-tertiary-container text-on-primary rounded-full text-sm flex items-center justify-center font-bold mx-auto mb-4">S</div>
    <h1 class="text-2xl font-bold tracking-tight">SAP 회원가입</h1>
    <p class="text-sm text-on-surface-variant mt-2">아래 정보를 입력해 계정을 만드세요.</p>
  </div>

  <form id="signup-form" class="flex flex-col gap-4">
    <div>
      <label for="username-input" class="block text-sm font-medium mb-1">아이디</label>
      <input type="text" id="username-input" required autocomplete="username"
        class="glass-input w-full px-4 py-2.5 rounded-2xl text-sm">
      <p id="username-hint" class="text-xs mt-1 hidden"></p>
    </div>

    <div>
      <label for="password-input" class="block text-sm font-medium mb-1">비밀번호</label>
      <input type="password" id="password-input" required autocomplete="new-password"
        class="glass-input w-full px-4 py-2.5 rounded-2xl text-sm">
    </div>

    <div>
      <label for="password-confirm-input" class="block text-sm font-medium mb-1">비밀번호 확인</label>
      <input type="password" id="password-confirm-input" required autocomplete="new-password"
        class="glass-input w-full px-4 py-2.5 rounded-2xl text-sm">
      <p id="password-match-hint" class="text-xs mt-1 hidden text-error">비밀번호가 일치하지 않습니다.</p>
    </div>

    <div>
      <label for="name-input" class="block text-sm font-medium mb-1">이름</label>
      <input type="text" id="name-input" required autocomplete="name"
        class="glass-input w-full px-4 py-2.5 rounded-2xl text-sm">
    </div>

    <div>
      <label for="grade-class-input" class="block text-sm font-medium mb-1">학년반</label>
      <select id="grade-class-input" required
        class="glass-input w-full px-4 py-2.5 rounded-2xl text-sm"></select>
    </div>

    <div>
      <label for="phone-input" class="block text-sm font-medium mb-1">전화번호</label>
      <input type="tel" id="phone-input" required autocomplete="tel" placeholder="010-0000-0000"
        class="glass-input w-full px-4 py-2.5 rounded-2xl text-sm">
    </div>

    <button type="submit" id="signup-submit"
      class="pill-btn-primary w-full text-sm px-4 py-2.5 mt-2">
      회원가입
    </button>
  </form>

  <p id="signup-status" class="text-sm text-center mt-4 hidden"></p>

  <p class="text-center text-sm text-on-surface-variant mt-6">
    이미 계정이 있으신가요? <a href="login.html" class="text-primary font-medium hover:opacity-80">로그인</a>
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/grade-class.js?v=2"></script>
<script>
  const form = document.getElementById('signup-form');
  const usernameInput = document.getElementById('username-input');
  const usernameHint = document.getElementById('username-hint');
  const passwordInput = document.getElementById('password-input');
  const passwordConfirmInput = document.getElementById('password-confirm-input');
  const passwordMatchHint = document.getElementById('password-match-hint');
  const nameInput = document.getElementById('name-input');
  const gradeClassInput = document.getElementById('grade-class-input');
  const phoneInput = document.getElementById('phone-input');
  const submitBtn = document.getElementById('signup-submit');
  const status = document.getElementById('signup-status');

  renderGradeClassOptions(gradeClassInput);

  function showStatus(message, isError) {
    status.textContent = message;
    status.classList.remove('hidden', 'text-error', 'text-on-surface-variant');
    status.classList.add(isError ? 'text-error' : 'text-on-surface-variant');
  }

  // Supabase Auth는 이메일 형식의 식별자를 요구한다. 사용자가 이메일을 입력하지 않아도
  // 아이디를 UTF-8 16진수로 변환한 내부 전용 주소를 만들어 기존 아이디 로그인 구조를 유지한다.
  function internalAuthEmail(username) {
    const bytes = new TextEncoder().encode(username.trim().toLowerCase());
    const encoded = Array.from(bytes, (byte) => byte.toString(16).padStart(2, '0')).join('');
    return `u${encoded}@sap.local`;
  }

  usernameInput.addEventListener('blur', async () => {
    const username = usernameInput.value.trim();
    usernameHint.classList.add('hidden');
    if (!username || !window.supabaseClient) return;

    const { data: exists, error } = await window.supabaseClient.rpc('username_exists', { p_username: username });
    if (error) return;

    usernameHint.classList.remove('hidden');
    if (exists) {
      usernameHint.textContent = '이미 사용 중인 아이디입니다.';
      usernameHint.classList.add('text-error');
      usernameHint.classList.remove('text-on-surface-variant');
    } else {
      usernameHint.textContent = '사용할 수 있는 아이디입니다.';
      usernameHint.classList.add('text-on-surface-variant');
      usernameHint.classList.remove('text-error');
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    passwordMatchHint.classList.add('hidden');

    if (passwordInput.value !== passwordConfirmInput.value) {
      passwordMatchHint.classList.remove('hidden');
      return;
    }

    if (!window.supabaseClient) {
      showStatus('Supabase 설정이 없습니다. assets/config.example.js를 assets/config.js로 복사하고 값을 채워주세요.', true);
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = '가입 중...';

    const { data, error } = await window.supabaseClient.auth.signUp({
      email: internalAuthEmail(usernameInput.value),
      password: passwordInput.value,
      options: {
        data: {
          username: usernameInput.value.trim(),
          name: nameInput.value.trim(),
          grade_class: gradeClassInput.value,
          phone: phoneInput.value.trim()
        }
      }
    });

    submitBtn.disabled = false;
    submitBtn.textContent = '회원가입';

    if (error) {
      showStatus(error.message, true);
      return;
    }

    if (data.session) {
      showStatus('가입이 완료되었습니다. Home으로 이동합니다...', false);
      setTimeout(() => { window.location.href = 'home.html'; }, 1000);
    } else {
      // Supabase 프로젝트의 Authentication -> Sign In / Providers -> Email에서
      // "Confirm email"이 꺼져 있으면 signUp() 직후 세션이 바로 오므로 이 분기는 타지 않는다.
      // 혹시 이 분기를 타면 그 설정이 다시 켜졌다는 뜻이므로 로그인 페이지로 안내한다.
      showStatus('가입이 완료되었습니다. 로그인 페이지에서 로그인해주세요.', false);
      setTimeout(() => { window.location.href = 'login.html'; }, 1500);
    }
  });
</script>
</body>
</html>
