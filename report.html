<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>학생 개인 리포트 - SAP 1기</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="assets/js/tailwind-config.js"></script>
<link href="assets/css/app.css" rel="stylesheet">
</head>
<body class="text-on-surface min-h-screen">
<div class="mesh-bg"></div>
<main class="relative max-w-[1100px] mx-auto px-4 sm:px-6 py-8 sm:py-12">
  <section id="report-loading" class="glass-panel rounded-[2rem] p-12 text-center"><i class="fa-solid fa-spinner fa-spin text-2xl text-primary mb-3"></i><p class="text-sm text-on-surface-variant">리포트를 불러오고 있습니다.</p></section>
  <section id="report-error" class="hidden glass-panel rounded-[2rem] p-12 text-center"><i class="fa-solid fa-link-slash text-3xl text-error mb-3"></i><p class="font-bold">리포트를 열 수 없습니다.</p><p class="text-sm text-on-surface-variant mt-2">링크가 잘못되었거나 유효기간이 끝났습니다.</p></section>
  <div id="report-content" class="hidden">
    <header class="glass-panel rounded-[2rem] p-6 sm:p-8 mb-6 flex flex-wrap items-end justify-between gap-4">
      <div><p class="text-xs font-bold tracking-[0.2em] text-primary mb-2">SAP 1기</p><h1 class="text-3xl sm:text-4xl font-bold">개인 활동 리포트</h1><p id="report-student" class="text-sm text-on-surface-variant mt-3"></p></div>
      <p id="report-generated" class="text-xs text-on-surface-variant"></p>
    </header>
    <section class="glass-card rounded-[1.5rem] p-4 sm:p-6 mb-6"><h2 class="text-lg font-bold mb-4">일별 활동</h2><div class="overflow-x-auto"><table class="w-full min-w-[680px] text-sm"><thead><tr class="border-b border-outline-variant text-left text-xs text-on-surface-variant"><th class="py-3 px-2">날짜</th><th class="py-3 px-2">기도</th><th class="py-3 px-2">말씀</th><th class="py-3 px-2">공부</th><th class="py-3 px-2">예배</th><th class="py-3 px-2">합계</th></tr></thead><tbody id="report-daily-body"></tbody></table></div></section>
    <section class="mb-6"><div class="flex items-center gap-2 mb-4"><i class="fa-solid fa-hands-praying text-primary"></i><h2 class="text-xl font-bold">기도 인증</h2></div><div id="report-pray-posts" class="grid grid-cols-1 lg:grid-cols-2 gap-5"></div></section>
    <section><div class="flex items-center gap-2 mb-4"><i class="fa-solid fa-book-bible text-secondary"></i><h2 class="text-xl font-bold">말씀 묵상 인증</h2></div><div id="report-word-posts" class="grid grid-cols-1 lg:grid-cols-2 gap-5"></div></section>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/report.js?v=1"></script>
</body>
</html>
