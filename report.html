<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>학생 개인 리포트 - SAP 1기</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="assets/js/tailwind-config.js"></script>
<link href="assets/css/app.css" rel="stylesheet">
</head>
<body class="text-on-surface min-h-screen">
<div class="mesh-bg"></div>
<main class="relative max-w-[1100px] mx-auto px-4 sm:px-6 py-8 sm:py-12">
  <section id="report-loading" class="glass-panel rounded-[2rem] p-12 text-center"><i class="fa-solid fa-spinner fa-spin text-2xl text-primary mb-3"></i><p class="text-sm text-on-surface-variant">리포트를 불러오고 있습니다.</p></section>
  <section id="report-error" class="hidden glass-panel rounded-[2rem] p-12 text-center"><i class="fa-solid fa-link-slash text-3xl text-error mb-3"></i><p class="font-bold">리포트를 열 수 없습니다.</p><p class="text-sm text-on-surface-variant mt-2">링크가 잘못되었거나 유효기간이 끝났습니다.</p></section>
  <div id="report-content" class="hidden">
    <header class="glass-panel rounded-[2rem] p-6 sm:p-8 mb-6 flex flex-wrap items-end justify-between gap-4">
      <div><p class="text-xs font-bold tracking-[0.2em] text-primary mb-2">SAP 1기</p><h1 class="text-3xl sm:text-4xl font-bold">개인 활동 리포트</h1><p id="report-student" class="text-sm text-on-surface-variant mt-3"></p></div>
      <p id="report-generated" class="text-xs text-on-surface-variant"></p>
    </header>
    <section class="mb-6">
      <div id="report-kpis" class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-4"></div>
      <article class="glass-card rounded-[1.5rem] p-5 sm:p-6">
        <div class="flex flex-wrap items-end justify-between gap-2 mb-5"><div><h2 class="text-lg font-bold">활동 시간 구성</h2><p class="text-xs text-on-surface-variant mt-1">운영기간 동안 카테고리별로 쌓인 시간입니다.</p></div><p id="report-total-time" class="text-sm font-bold text-primary"></p></div>
        <div id="report-category-stats" class="grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-4"></div>
      </article>
    </section>
    <section class="glass-card rounded-[1.5rem] p-4 sm:p-6 mb-6">
      <p class="text-sm font-bold text-on-surface-variant mb-4">활동 시간 추이</p>
      <div class="relative h-56 sm:h-64 lg:h-72"><canvas id="report-trend-chart"></canvas></div>
    </section>
    <section class="glass-card rounded-[1.5rem] p-3 sm:p-6 mb-6"><h2 class="text-lg font-bold mb-3 sm:mb-4">일별 활동</h2><div class="overflow-x-auto"><table class="w-full table-fixed text-[10px] sm:text-sm"><colgroup><col class="w-[18%]"><col class="w-[16%]"><col class="w-[16%]"><col class="w-[16%]"><col class="w-[16%]"><col class="w-[18%]"></colgroup><thead><tr class="border-b border-outline-variant text-center text-[10px] sm:text-xs text-on-surface-variant"><th class="py-2 px-0.5">날짜</th><th class="py-2 px-0.5">기도</th><th class="py-2 px-0.5">말씀</th><th class="py-2 px-0.5">공부</th><th class="py-2 px-0.5">예배</th><th class="py-2 px-0.5">합계</th></tr></thead><tbody id="report-daily-body"></tbody></table></div></section>
    <section class="mb-6"><div class="flex items-center gap-2 mb-4"><i class="fa-solid fa-hands-praying text-primary"></i><h2 class="text-xl font-bold">기도 인증</h2><span class="flex-1"></span><button type="button" data-report-carousel-target="report-pray-posts" data-report-carousel-direction="-1" class="icon-glass w-9 h-9 rounded-full" aria-label="이전 기도 인증"><i class="fa-solid fa-chevron-left text-xs"></i></button><button type="button" data-report-carousel-target="report-pray-posts" data-report-carousel-direction="1" class="icon-glass w-9 h-9 rounded-full" aria-label="다음 기도 인증"><i class="fa-solid fa-chevron-right text-xs"></i></button></div><div id="report-pray-posts" class="flex gap-4 overflow-x-auto snap-x snap-mandatory scrollbar-hide pb-2"></div></section>
    <section><div class="flex items-center gap-2 mb-4"><i class="fa-solid fa-book-bible text-secondary"></i><h2 class="text-xl font-bold">말씀 묵상 인증</h2><span class="flex-1"></span><button type="button" data-report-carousel-target="report-word-posts" data-report-carousel-direction="-1" class="icon-glass w-9 h-9 rounded-full" aria-label="이전 말씀 인증"><i class="fa-solid fa-chevron-left text-xs"></i></button><button type="button" data-report-carousel-target="report-word-posts" data-report-carousel-direction="1" class="icon-glass w-9 h-9 rounded-full" aria-label="다음 말씀 인증"><i class="fa-solid fa-chevron-right text-xs"></i></button></div><div id="report-word-posts" class="flex gap-4 overflow-x-auto snap-x snap-mandatory scrollbar-hide pb-2"></div></section>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="assets/js/report.js?v=6"></script>
</body>
</html>
