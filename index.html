<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyPage - SAP 1기</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="assets/js/tailwind-config.js"></script>
<link href="assets/css/app.css" rel="stylesheet">
</head>
<body class="text-on-surface">
<div id="app"></div>
<template id="page-content">
  <!-- Header -->
  <div class="flex justify-between items-center mb-8 lg:mb-10">
    <h1 class="text-3xl lg:text-4xl font-bold tracking-tight">MyPage</h1>
  </div>

  <!-- Overview widgets -->
  <section class="grid grid-cols-1 sm:grid-cols-2 gap-4 lg:gap-6 mb-8 lg:mb-12">
    <!-- Daily Goals -->
    <div class="glass-card rounded-[1.5rem] p-6">
      <h3 class="text-sm font-medium text-on-surface-variant mb-6">Today</h3>
      <div class="relative w-36 h-36 mx-auto">
        <svg viewBox="0 0 120 120" class="w-full h-full -rotate-90">
          <circle cx="60" cy="60" r="52" fill="none" stroke-width="12" class="stroke-surface-highest"></circle>
          <circle id="daily-goal-ring" cx="60" cy="60" r="52" fill="none" stroke-width="12" stroke-linecap="round" stroke="url(#daily-goal-gradient-low)"></circle>
          <defs>
            <linearGradient id="daily-goal-gradient-low" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#aa3524"></stop>
              <stop offset="100%" stop-color="#ee6650"></stop>
            </linearGradient>
            <linearGradient id="daily-goal-gradient-high" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ff4b91"></stop>
              <stop offset="100%" stop-color="#6e4f9c"></stop>
            </linearGradient>
          </defs>
        </svg>
        <div class="absolute inset-0 flex flex-col items-center justify-center">
          <p id="daily-goal-percent" class="text-3xl font-bold text-on-surface">0%</p>
          <p id="daily-goal-caption" class="text-[11px] font-semibold text-on-surface-variant tracking-wide mt-0.5">달성</p>
        </div>
      </div>
      <p class="text-center text-xs text-on-surface-variant mt-4">기도 · 말씀 · 공부 · 예배</p>
      <p id="daily-goal-total" class="text-center text-3xl font-bold text-on-surface mt-2">0분 / 300분</p>
    </div>

    <!-- Calendar -->
    <div class="glass-card rounded-[1.5rem] p-6">
      <div class="flex items-center justify-between mb-6">
        <div class="glass-panel rounded-full p-1 flex text-sm font-semibold">
          <button type="button" id="calendar-tab-weekly" class="px-3.5 py-1.5 rounded-full nav-pill-active transition-colors">Weekly</button>
          <button type="button" id="calendar-tab-monthly" class="px-3.5 py-1.5 rounded-full text-on-surface-variant transition-colors">Monthly</button>
        </div>
        <button type="button" class="icon-glass w-9 h-9 rounded-full flex items-center justify-center text-on-surface-variant" aria-label="설정">
          <i class="fa-solid fa-gear text-sm"></i>
        </button>
      </div>
      <div class="flex items-end gap-2 mb-6">
        <p id="calendar-month" class="text-3xl font-bold text-on-surface"></p>
        <p id="calendar-day" class="text-3xl font-bold text-outline-variant"></p>
      </div>
      <div id="calendar-weekly-view">
        <div id="calendar-strip" class="grid grid-cols-7 gap-y-4"></div>
      </div>
      <div id="calendar-monthly-view" class="hidden grid grid-cols-7 gap-y-2 text-center"></div>
    </div>
  </section>

  <!-- Section 2: 인증하기 -->
  <div class="flex items-center gap-3 mb-1">
    <h2 class="text-lg lg:text-xl font-bold">인증하기</h2>
  </div>
  <div class="flex items-center gap-2 mb-4">
    <p id="selected-date-label" class="text-xs text-on-surface-variant"></p>
    <button id="selected-date-reset" type="button" class="hidden text-xs font-medium text-primary hover:opacity-80">오늘로 돌아가기</button>
  </div>
  <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 lg:gap-6 mb-8">
    <!-- 기도 (blank widget) -->
    <div id="widget-pray" data-widget="pray" class="widget-card glass-card rounded-[1.5rem] p-6 cursor-pointer hover:bg-white transition-colors">
      <div class="absolute top-4 right-4">
        <div class="icon-glass w-8 h-8 rounded-full text-on-surface-variant flex items-center justify-center shrink-0" data-progress-icon="pray">
          <i class="fa-solid fa-check text-sm"></i>
        </div>
      </div>
      <h3 class="text-sm font-medium text-on-surface-variant pr-8">기도</h3>
      <div class="widget-summary mt-10">
        <div class="w-full border-t-2 border-dashed border-outline-variant"></div>
      </div>
    </div>
    <!-- 말씀 (blank widget) -->
    <div id="widget-word" data-widget="word" class="widget-card glass-card rounded-[1.5rem] p-6 cursor-pointer hover:bg-white transition-colors">
      <div class="absolute top-4 right-4">
        <div class="icon-glass w-8 h-8 rounded-full text-on-surface-variant flex items-center justify-center shrink-0" data-progress-icon="word">
          <i class="fa-solid fa-check text-sm"></i>
        </div>
      </div>
      <h3 class="text-sm font-medium text-on-surface-variant pr-8">말씀</h3>
      <div class="widget-summary mt-10">
        <div class="w-full border-t-2 border-dashed border-outline-variant"></div>
      </div>
    </div>
    <!-- 공부 (Record 타이머 + 수동 추가, 클릭 시 기록 내역) -->
    <div id="widget-study" data-widget="study" class="widget-card glass-card rounded-[1.5rem] p-6 cursor-pointer hover:bg-white transition-colors">
      <div class="absolute top-4 right-4">
        <div class="icon-glass w-8 h-8 rounded-full text-on-surface-variant flex items-center justify-center shrink-0" data-progress-icon="study">
          <i class="fa-solid fa-check text-sm"></i>
        </div>
      </div>
      <h3 class="text-sm font-medium text-on-surface-variant mb-3 pr-8">공부</h3>
      <div class="flex items-center gap-2 flex-wrap mb-4">
        <button id="study-record-btn" type="button" class="pill-btn-primary px-3.5 py-1.5 text-xs flex items-center gap-1.5">
          <i class="fa-solid fa-circle text-[7px] text-error"></i> Record
        </button>
        <button id="study-add-btn" type="button" class="glass-card px-3.5 py-1.5 rounded-full text-xs font-medium text-on-surface-variant hover:text-on-surface transition-colors">
          + 공부 시간 입력
        </button>
      </div>
      <div class="widget-summary">
        <div class="w-full border-t-2 border-dashed border-outline-variant"></div>
      </div>
    </div>
    <!-- 예배 (수/금만 활성화, O·X·가정 선택) -->
    <div id="widget-worship" data-widget="worship" class="widget-card glass-card rounded-[1.5rem] p-6 transition-colors">
      <div class="absolute top-4 right-4">
        <div class="icon-glass w-8 h-8 rounded-full text-on-surface-variant flex items-center justify-center shrink-0" data-progress-icon="worship">
          <i class="fa-solid fa-check text-sm"></i>
        </div>
      </div>
      <h3 class="text-sm font-medium text-on-surface-variant pr-8">예배</h3>
      <div class="widget-summary mt-10">
        <div class="w-full border-t-2 border-dashed border-outline-variant"></div>
      </div>
    </div>
  </section>

  <div class="flex justify-center mb-16">
    <button id="verification-save-btn" type="button" class="pill-btn-primary px-8 py-2.5 text-sm">저장하기</button>
  </div>

  <!-- 기도 인증 모달 -->
  <div id="pray-modal" class="hidden fixed inset-0 z-[60] items-center justify-center px-4">
    <div id="pray-modal-overlay" class="absolute inset-0 bg-on-surface/30 backdrop-blur-sm"></div>
    <div class="glass-panel relative rounded-[2rem] w-full max-w-lg max-h-[85vh] overflow-y-auto p-6 sm:p-8">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-bold">기도 인증</h2>
        <button id="pray-modal-close" type="button" class="icon-glass w-9 h-9 rounded-full flex items-center justify-center text-on-surface-variant" aria-label="닫기">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div id="pray-class-list" class="flex flex-col gap-4"></div>
      <p id="pray-class-hint" class="text-xs text-error mt-2 hidden">사진 첨부, 기도 장소, 시작/종료 일시를 모두 입력해주세요.</p>

      <button id="pray-add-class" type="button" aria-label="클래스 추가" class="glass-card w-full mt-4 py-2.5 rounded-2xl text-sm font-medium text-on-surface-variant hover:text-on-surface flex items-center justify-center transition-colors">
        <i class="fa-solid fa-plus"></i>
      </button>

      <div class="flex gap-3 mt-6">
        <button id="pray-cancel" type="button" class="glass-card flex-1 py-2.5 rounded-full text-sm font-medium text-on-surface-variant hover:text-on-surface transition-colors">취소</button>
        <button id="pray-save" type="button" class="pill-btn-primary flex-1 py-2.5 text-sm">저장</button>
      </div>
      <button id="pray-reset" type="button" class="block mx-auto mt-4 text-xs font-medium text-error hover:opacity-80">전체 초기화</button>
    </div>
  </div>

  <!-- 기도 인증 클래스 입력 필드 템플릿 (사진첨부 / 기도장소 / 시작시간 / 종료시간) -->
  <template id="pray-class-template">
    <div class="pray-class-entry glass-card rounded-2xl p-4 relative">
      <button type="button" class="pray-remove-class hidden absolute top-3 right-3 icon-glass w-7 h-7 rounded-full flex items-center justify-center text-on-surface-variant text-xs" aria-label="클래스 삭제">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <div class="flex flex-col gap-3 pr-8">
        <div>
          <label class="block text-xs font-medium text-on-surface-variant mb-1">사진 첨부 <span class="text-error">*</span></label>
          <input type="file" accept="image/*" class="pray-photo-input w-full text-xs text-on-surface-variant file:mr-3 file:py-1.5 file:px-3 file:rounded-full file:border-0 file:text-xs file:font-medium file:bg-white file:text-on-surface">
          <div class="pray-photo-preview-wrap hidden relative mt-2">
            <img class="pray-photo-preview w-full h-40 object-contain bg-surface-container rounded-xl" alt="첨부한 사진 미리보기">
            <button type="button" class="pray-photo-remove absolute top-2 right-2 icon-glass w-7 h-7 rounded-full flex items-center justify-center text-on-surface-variant text-xs" aria-label="사진 삭제">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
          <label class="flex items-center gap-2 text-xs text-on-surface-variant mt-2 select-none cursor-pointer">
            <input type="checkbox" class="pray-photo-unavailable-input w-3.5 h-3.5 rounded accent-primary">
            사진을 찍지 못했어요
          </label>
        </div>
        <div>
          <label class="block text-xs font-medium text-on-surface-variant mb-1">기도 장소 <span class="text-error">*</span></label>
          <select class="pray-location-input glass-input w-full px-3 py-2 rounded-xl text-sm">
            <option value="대성전">대성전</option>
            <option value="요한성전">요한성전</option>
            <option value="중등부기도">중등부기도</option>
            <option value="가정">가정</option>
            <option value="기타">기타</option>
          </select>
          <input type="text" placeholder="기도 장소를 입력해주세요" class="pray-location-other-input hidden glass-input w-full px-3 py-2 rounded-xl text-sm mt-2">
        </div>
        <div>
          <label class="block text-xs font-medium text-on-surface-variant mb-1">시작 일시 <span class="text-error">*</span></label>
          <input type="datetime-local" class="pray-start-input glass-input w-full px-3 py-2 rounded-xl text-sm">
        </div>
        <div>
          <label class="block text-xs font-medium text-on-surface-variant mb-1">종료 일시 <span class="text-error">*</span></label>
          <input type="datetime-local" class="pray-end-input glass-input w-full px-3 py-2 rounded-xl text-sm">
        </div>
        <p class="text-[10px] text-on-surface-variant -mt-2">기록은 시작 일시의 날짜 기준으로 저장돼요 (예: 12/31 23시 시작 → 1/1 1시 종료는 12/31 기록).</p>
        <p class="pray-entry-datetime text-[11px] text-on-surface-variant"></p>
      </div>
    </div>
  </template>

  <!-- 말씀 인증 모달 -->
  <div id="word-modal" class="hidden fixed inset-0 z-[60] items-center justify-center px-4">
    <div id="word-modal-overlay" class="absolute inset-0 bg-on-surface/30 backdrop-blur-sm"></div>
    <div class="glass-panel relative rounded-[2rem] w-full max-w-lg max-h-[85vh] overflow-y-auto p-6 sm:p-8">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-bold">말씀 인증</h2>
        <button id="word-modal-close" type="button" class="icon-glass w-9 h-9 rounded-full flex items-center justify-center text-on-surface-variant" aria-label="닫기">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="mb-5">
        <label class="block text-xs font-medium text-on-surface-variant mb-1">사진 첨부 <span class="text-error">*</span></label>
        <input type="file" accept="image/*" id="word-photo-input" class="w-full text-xs text-on-surface-variant file:mr-3 file:py-1.5 file:px-3 file:rounded-full file:border-0 file:text-xs file:font-medium file:bg-white file:text-on-surface">
        <div id="word-photo-preview-wrap" class="hidden relative mt-2">
          <img id="word-photo-preview" class="w-full h-40 object-contain bg-surface-container rounded-xl" alt="첨부한 사진 미리보기">
          <button type="button" id="word-photo-remove" class="absolute top-2 right-2 icon-glass w-7 h-7 rounded-full flex items-center justify-center text-on-surface-variant text-xs" aria-label="사진 삭제">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <p id="word-photo-hint" class="text-xs text-error mt-1 hidden">사진을 첨부해주세요.</p>
      </div>

      <div id="word-verse-list" class="flex flex-col gap-4"></div>
      <p id="word-verse-hint" class="text-xs text-error mt-2 hidden">시작 책과 장, 끝 책과 장을 모두 입력해주세요.</p>

      <button id="word-add-verse" type="button" aria-label="구절 추가" class="glass-card w-full mt-4 py-2.5 rounded-2xl text-sm font-medium text-on-surface-variant hover:text-on-surface flex items-center justify-center transition-colors">
        <i class="fa-solid fa-plus"></i>
      </button>

      <div class="flex gap-3 mt-6">
        <button id="word-cancel" type="button" class="glass-card flex-1 py-2.5 rounded-full text-sm font-medium text-on-surface-variant hover:text-on-surface transition-colors">취소</button>
        <button id="word-save" type="button" class="pill-btn-primary flex-1 py-2.5 text-sm">저장</button>
      </div>
      <button id="word-reset" type="button" class="block mx-auto mt-4 text-xs font-medium text-error hover:opacity-80">전체 초기화</button>
    </div>
  </div>

  <!-- 읽은 말씀 구절 입력 필드 템플릿 (시작 책/장/절 ~ 끝 책/장/절) -->
  <template id="word-verse-template">
    <div class="word-verse-entry glass-card rounded-2xl p-4 relative">
      <button type="button" class="word-remove-verse hidden absolute top-3 right-3 icon-glass w-7 h-7 rounded-full flex items-center justify-center text-on-surface-variant text-xs" aria-label="구절 삭제">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <div class="flex flex-col gap-3 pr-8">
        <div>
          <label class="block text-xs font-medium text-on-surface-variant mb-1">시작 책:장</label>
          <div class="grid grid-cols-[minmax(0,1fr)_auto_5rem] gap-2 items-center">
            <select class="word-start-book glass-input px-2 py-2 rounded-xl text-xs"></select>
            <span class="font-bold text-on-surface-variant">:</span>
            <input type="number" min="1" placeholder="장" class="word-start-chapter glass-input px-2 py-2 rounded-xl text-xs">
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium text-on-surface-variant mb-1">끝 책:장</label>
          <div class="grid grid-cols-[minmax(0,1fr)_auto_5rem] gap-2 items-center">
            <select class="word-end-book glass-input px-2 py-2 rounded-xl text-xs"></select>
            <span class="font-bold text-on-surface-variant">:</span>
            <input type="number" min="1" placeholder="장" class="word-end-chapter glass-input px-2 py-2 rounded-xl text-xs">
          </div>
        </div>
        <div class="word-meditation-time-wrap hidden">
          <label class="block text-xs font-medium text-on-surface-variant mb-1">말씀 묵상 시간 (분)</label>
          <input type="number" min="1" max="1440" step="1" inputmode="numeric" placeholder="예: 30" class="word-meditation-minutes glass-input w-full px-3 py-2 rounded-xl text-xs">
          <p class="text-[10px] text-on-surface-variant mt-1">입력한 시간이 기본 60분에 추가됩니다.</p>
        </div>
      </div>
    </div>
  </template>

  <!-- 공부 시간 수동 추가 모달 (숫자 입력만 허용, 텍스트 입력 불가) -->
  <div id="study-add-modal" class="hidden fixed inset-0 z-[60] items-center justify-center px-4">
    <div id="study-add-overlay" class="absolute inset-0 bg-on-surface/30 backdrop-blur-sm"></div>
    <div class="glass-panel relative rounded-[2rem] w-full max-w-sm p-6 sm:p-8">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-bold">공부 시간 추가</h2>
        <button id="study-add-modal-close" type="button" class="icon-glass w-9 h-9 rounded-full flex items-center justify-center text-on-surface-variant" aria-label="닫기">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <label class="block text-xs font-medium text-on-surface-variant mb-1">공부한 시간 (분)</label>
      <input type="number" id="study-add-minutes-input" inputmode="numeric" min="1" step="1" placeholder="예: 30" class="glass-input w-full px-4 py-2.5 rounded-2xl text-sm">
      <div class="flex gap-3 mt-6">
        <button id="study-add-cancel" type="button" class="glass-card flex-1 py-2.5 rounded-full text-sm font-medium text-on-surface-variant hover:text-on-surface transition-colors">취소</button>
        <button id="study-add-save" type="button" class="pill-btn-primary flex-1 py-2.5 text-sm">추가</button>
      </div>
    </div>
  </div>

  <!-- 공부 Record 전체화면 타이머 (다른 화면으로 이동/백그라운드 전환 시 자동 일시정지) -->
  <div id="study-record-modal" class="hidden fixed inset-0 z-[70] items-center justify-center bg-surface">
    <div class="flex flex-col items-center gap-8">
      <p id="study-record-status" class="text-sm font-medium text-on-surface-variant tracking-wide">공부 기록 중</p>
      <p id="study-record-timer" class="text-6xl font-bold text-on-surface tabular-nums">00:00</p>
      <div class="flex items-center gap-3">
        <button id="study-pause-btn" type="button" class="pill-btn-primary px-8 py-3 text-base flex items-center gap-2">
          <i class="fa-solid fa-pause"></i> Pause
        </button>
        <button id="study-resume-btn" type="button" class="hidden pill-btn-primary px-8 py-3 text-base flex items-center gap-2">
          <i class="fa-solid fa-play"></i> On
        </button>
        <button id="study-stop-btn" type="button" class="glass-card px-8 py-3 text-base font-medium text-error flex items-center gap-2">
          <i class="fa-solid fa-stop"></i> Off
        </button>
      </div>
      <p class="text-xs text-on-surface-variant text-center max-w-xs">다른 화면으로 이동하면 자동으로 일시정지돼요.</p>
    </div>
  </div>

  <!-- 공부 기록 내역 (Record / 직접 입력 분리) -->
  <div id="study-history-modal" class="hidden fixed inset-0 z-[60] items-center justify-center px-4">
    <div id="study-history-overlay" class="absolute inset-0 bg-on-surface/30 backdrop-blur-sm"></div>
    <div class="glass-panel relative rounded-[2rem] w-full max-w-lg max-h-[85vh] overflow-y-auto p-6 sm:p-8">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-bold">공부 기록</h2>
        <button id="study-history-close" type="button" class="icon-glass w-9 h-9 rounded-full flex items-center justify-center text-on-surface-variant" aria-label="닫기">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="mb-6">
        <div class="flex items-center justify-between mb-2">
          <h3 class="text-sm font-semibold text-on-surface">Record로 기록한 시간</h3>
          <span id="study-history-record-total" class="text-sm font-bold text-primary"></span>
        </div>
        <div id="study-history-record-list" class="flex flex-col gap-2"></div>
      </div>

      <div>
        <div class="flex items-center justify-between mb-2">
          <h3 class="text-sm font-semibold text-on-surface">직접 입력한 시간</h3>
