<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home - SAP 1기</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="assets/js/tailwind-config.js"></script>
<link href="assets/css/app.css" rel="stylesheet">
</head>
<body class="text-on-surface">
<div id="app"></div>
<template id="page-content">
  <!-- Header -->
  <div class="flex justify-between items-center mb-8 lg:mb-10">
    <h1 class="text-3xl lg:text-4xl font-bold tracking-tight">Home</h1>
    <div class="relative hidden lg:block">
      <button class="glass-card flex items-center gap-2 px-4 py-2.5 rounded-full text-sm font-medium hover:bg-white transition-colors">
        <span>Aug 2024</span>
        <i class="fa-solid fa-chevron-down text-[10px] text-on-surface-variant"></i>
      </button>
    </div>
  </div>

  <!-- Section 1: Progress -->
  <section class="mb-8 lg:mb-12">
    <div class="flex items-center justify-between mb-3 lg:mb-4">
      <h2 class="text-lg lg:text-xl font-bold">Progress</h2>
      <button class="glass-card text-sm text-on-surface-variant flex items-center gap-1.5 rounded-full px-3.5 py-1.5 hover:text-on-surface transition-colors">
        <i class="fa-solid fa-xmark"></i> Dismiss
      </button>
    </div>
    <div class="glass-panel rounded-[2rem] p-4 sm:p-6 lg:p-8 flex flex-col lg:flex-row gap-6 lg:gap-12 relative overflow-hidden">
      <div class="flex-1 space-y-4 lg:space-y-5 relative z-10">
        <div class="flex items-center gap-3 lg:gap-4">
          <div class="icon-glass w-8 h-8 rounded-full text-on-surface-variant flex items-center justify-center shrink-0" data-progress-icon="pray">
            <i class="fa-solid fa-check text-sm"></i>
          </div>
          <span class="text-sm lg:text-base font-medium">1. 기도</span>
        </div>
        <div class="flex items-center gap-3 lg:gap-4">
          <div class="icon-glass w-8 h-8 rounded-full text-on-surface-variant flex items-center justify-center shrink-0" data-progress-icon="word">
            <i class="fa-solid fa-check text-sm"></i>
          </div>
          <span class="text-sm lg:text-base font-medium">2. 말씀</span>
        </div>
        <div class="flex items-center gap-3 lg:gap-4">
          <div class="icon-glass w-8 h-8 rounded-full text-on-surface-variant flex items-center justify-center shrink-0" data-progress-icon="study">
            <i class="fa-solid fa-check text-sm"></i>
          </div>
          <span class="text-sm lg:text-base font-medium">3. 공부</span>
        </div>
        <div class="flex items-center gap-3 lg:gap-4">
          <div class="icon-glass w-8 h-8 rounded-full text-on-surface-variant flex items-center justify-center shrink-0" data-progress-icon="worship">
            <i class="fa-solid fa-check text-sm"></i>
          </div>
          <span class="text-sm lg:text-base font-medium">4. 예배</span>
        </div>
      </div>
    </div>
  </section>

  <!-- Section 2: 인증하기 -->
  <h2 class="text-lg lg:text-xl font-bold mb-4">인증하기</h2>
  <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 lg:gap-6 mb-16">
    <!-- 기도 (blank widget) -->
    <div id="widget-pray" data-widget="pray" class="widget-card glass-card rounded-[1.5rem] p-6 cursor-pointer hover:bg-white transition-colors">
      <h3 class="text-sm font-medium text-on-surface-variant">기도</h3>
      <div class="widget-summary mt-10">
        <div class="w-full border-t-2 border-dashed border-outline-variant"></div>
      </div>
    </div>
    <!-- 말씀 (blank widget) -->
    <div data-widget="word" class="widget-card glass-card rounded-[1.5rem] p-6">
      <h3 class="text-sm font-medium text-on-surface-variant">말씀</h3>
      <div class="widget-summary mt-10">
        <div class="w-full border-t-2 border-dashed border-outline-variant"></div>
      </div>
    </div>
    <!-- 공부 (blank widget) -->
    <div data-widget="study" class="widget-card glass-card rounded-[1.5rem] p-6">
      <h3 class="text-sm font-medium text-on-surface-variant">공부</h3>
      <div class="widget-summary mt-10">
        <div class="w-full border-t-2 border-dashed border-outline-variant"></div>
      </div>
    </div>
    <!-- 예배 (blank widget) -->
    <div data-widget="worship" class="widget-card glass-card rounded-[1.5rem] p-6">
      <h3 class="text-sm font-medium text-on-surface-variant">예배</h3>
      <div class="widget-summary mt-10">
        <div class="w-full border-t-2 border-dashed border-outline-variant"></div>
      </div>
    </div>
  </section>

  <!-- 기도 인증 모달 -->
  <div id="pray-modal" class="hidden fixed inset-0 z-[60] items-center justify-center px-4">
    <div id="pray-modal-overlay" class="absolute inset-0 bg-on-surface/30 backdrop-blur-sm"></div>
    <div class="glass-panel relative rounded-[2rem] w-full max-w-lg max-h-[85vh] overflow-y-auto p-6 sm:p-8">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-bold">기도 인증</h2>
        <button id="pray-modal-close" type="button" class="icon-glass w-9 h-9 rounded-full flex items-center justify-center text-on-surface-variant" aria-label="닫기">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div id="pray-class-list" class="flex flex-col gap-4"></div>

      <button id="pray-add-class" type="button" aria-label="클래스 추가" class="glass-card w-full mt-4 py-2.5 rounded-2xl text-sm font-medium text-on-surface-variant hover:text-on-surface flex items-center justify-center transition-colors">
        <i class="fa-solid fa-plus"></i>
      </button>

      <div class="flex gap-3 mt-6">
        <button id="pray-cancel" type="button" class="glass-card flex-1 py-2.5 rounded-full text-sm font-medium text-on-surface-variant hover:text-on-surface transition-colors">취소</button>
        <button id="pray-save" type="button" class="pill-btn-primary flex-1 py-2.5 text-sm">저장</button>
      </div>
    </div>
  </div>

  <!-- 기도 인증 클래스 입력 필드 템플릿 (사진첨부 / 기도장소 / 시작시간 / 종료시간) -->
  <template id="pray-class-template">
    <div class="pray-class-entry glass-card rounded-2xl p-4 relative">
      <button type="button" class="pray-remove-class hidden absolute top-3 right-3 icon-glass w-7 h-7 rounded-full flex items-center justify-center text-on-surface-variant text-xs" aria-label="클래스 삭제">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <div class="flex flex-col gap-3 pr-8">
        <div>
          <label class="block text-xs font-medium text-on-surface-variant mb-1">사진 첨부</label>
          <input type="file" accept="image/*" class="pray-photo-input w-full text-xs text-on-surface-variant file:mr-3 file:py-1.5 file:px-3 file:rounded-full file:border-0 file:text-xs file:font-medium file:bg-white file:text-on-surface">
          <img class="pray-photo-preview hidden mt-2 w-full max-h-40 object-cover rounded-xl" alt="첨부한 사진 미리보기">
        </div>
        <div>
          <label class="block text-xs font-medium text-on-surface-variant mb-1">기도 장소</label>
          <select class="pray-location-input glass-input w-full px-3 py-2 rounded-xl text-sm">
            <option value="대성전">대성전</option>
            <option value="요한성전">요한성전</option>
            <option value="중등부기도">중등부기도</option>
            <option value="가정">가정</option>
          </select>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-on-surface-variant mb-1">시작 시간</label>
            <input type="time" class="pray-start-input glass-input w-full px-3 py-2 rounded-xl text-sm">
          </div>
          <div>
            <label class="block text-xs font-medium text-on-surface-variant mb-1">종료 시간</label>
            <input type="time" class="pray-end-input glass-input w-full px-3 py-2 rounded-xl text-sm">
          </div>
        </div>
      </div>
    </div>
  </template>
</template>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/home.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => renderApp({ activePage: 'home' }));
</script>
</body>
</html>
