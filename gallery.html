<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery - SAP 1기</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="assets/js/tailwind-config.js"></script>
<link href="assets/css/app.css" rel="stylesheet">
</head>
<body class="text-on-surface">
<div id="app"></div>
<template id="page-content">
  <div class="flex flex-wrap items-end justify-between gap-4 mb-6">
    <div>
      <h1 class="text-3xl lg:text-4xl font-bold tracking-tight">Gallery</h1>
    </div>
    <p class="text-xs text-on-surface-variant">2026.08.10 – 09.06 · Weekdays</p>
  </div>

  <section class="glass-panel rounded-[2rem] p-4 sm:p-5 mb-6 relative z-50 overflow-visible">
    <div class="flex items-center gap-3">
      <button id="gallery-prev-day" type="button" class="icon-glass w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0" aria-label="이전 날짜">
        <i class="fa-solid fa-chevron-left"></i>
      </button>
      <div class="flex-1 min-w-0 text-center relative">
        <p id="gallery-day-count" class="text-[11px] font-bold text-primary mb-1">DAY 1 / 20</p>
        <button id="gallery-calendar-toggle" type="button" class="glass-input rounded-xl px-4 py-2 text-sm font-semibold w-full max-w-[340px] mx-auto flex items-center justify-center gap-2" aria-haspopup="dialog" aria-expanded="false">
          <i class="fa-regular fa-calendar"></i><span id="gallery-date-display">2026-08-10</span>
        </button>
        <p id="gallery-date-label" class="text-xs text-on-surface-variant mt-1"></p>
        <p id="gallery-reading-label" class="text-xl sm:text-2xl font-black text-on-surface mt-2"></p>
        <div id="gallery-calendar-popover" style="background-color:#ffffff" class="hidden absolute z-[70] top-full left-1/2 -translate-x-1/2 mt-3 w-[min(92vw,560px)] rounded-[1.5rem] border border-outline-variant p-4 text-left shadow-xl">
          <div id="gallery-calendar-months"></div>
        </div>
      </div>
      <button id="gallery-next-day" type="button" class="icon-glass w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0" aria-label="다음 날짜">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>
  </section>

  <div class="glass-panel rounded-full p-1 flex w-fit mx-auto mb-5 text-sm font-semibold" id="gallery-type-tabs">
    <button id="gallery-type-pray" type="button" data-gallery-type-tab="pray" class="nav-pill-active rounded-full px-5 py-2 transition-colors"><i class="fa-solid fa-hands-praying mr-1.5"></i>기도</button>
    <button id="gallery-type-word" type="button" data-gallery-type-tab="word" class="text-on-surface-variant rounded-full px-5 py-2 transition-colors"><i class="fa-solid fa-book-bible mr-1.5"></i>말씀묵상</button>
  </div>

  <section class="mb-7">
    <div id="gallery-active-grid" class="gallery-swipe-grid"></div>
  </section>

  <nav id="gallery-pagination" class="flex items-center justify-center gap-2 pb-16" aria-label="학생 갤러리 페이지"></nav>

  <div id="gallery-comments-modal" class="hidden fixed inset-0 z-[80] items-end sm:items-center justify-center">
    <div id="gallery-comments-overlay" class="absolute inset-0 bg-on-surface/30 backdrop-blur-sm"></div>
    <section class="relative w-full sm:max-w-5xl h-[92vh] sm:h-[82vh] bg-white rounded-t-[2rem] sm:rounded-[2rem] shadow-2xl flex flex-col overflow-hidden">
      <header class="flex items-center justify-between px-5 py-4 border-b border-outline-variant flex-shrink-0">
        <div>
          <h2 class="font-bold">Comment</h2>
          <p id="gallery-comments-post-label" class="text-[11px] text-on-surface-variant mt-0.5"></p>
        </div>
        <button id="gallery-comments-close" type="button" class="icon-glass w-8 h-8 rounded-full flex items-center justify-center" aria-label="닫기"><i class="fa-solid fa-xmark"></i></button>
      </header>
      <div class="flex-1 min-h-0 grid grid-cols-1 sm:grid-cols-[1.15fr_0.85fr] overflow-y-auto sm:overflow-hidden">
        <div id="gallery-comments-post-preview" class="px-5 py-4 sm:p-6 border-b sm:border-b-0 sm:border-r border-outline-variant bg-surface-lowest sm:overflow-y-auto"></div>
        <div class="min-h-[320px] sm:min-h-0 flex flex-col">
          <div id="gallery-comments-list" class="flex-1 overflow-y-auto px-5 py-4 flex flex-col gap-4"></div>
          <form id="gallery-comments-form" class="flex items-center gap-2 px-4 py-3 border-t border-outline-variant flex-shrink-0">
            <button id="gallery-comments-edit-cancel" type="button" class="hidden text-xs text-on-surface-variant px-1">취소</button>
            <input id="gallery-comments-input" type="text" required maxlength="300" autocomplete="off" placeholder="댓글 달기..." class="glass-input flex-1 rounded-full px-4 py-2.5 text-sm">
            <button id="gallery-comments-submit" type="submit" class="text-primary font-bold text-sm px-2 disabled:opacity-40">게시</button>
          </form>
        </div>
      </div>
    </section>
  </div>
</template>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/auth-guard.js"></script>
<script src="assets/js/auth.js?v=9"></script>
<script src="assets/js/layout.js?v=17"></script>
<script src="assets/js/pray-word.js?v=9"></script>
<script src="assets/js/profile-avatar.js?v=4"></script>
<script src="assets/js/gallery.js?v=25"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    if (await requireAuth()) renderApp({ activePage: 'gallery' });
  });
</script>
</body>
</html>
