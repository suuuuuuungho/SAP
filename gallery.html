<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery - SAP 1기</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="assets/js/tailwind-config.js"></script>
<link href="assets/css/app.css" rel="stylesheet">
</head>
<body class="text-on-surface">
<div id="app"></div>
<template id="page-content">
  <div class="flex flex-wrap items-end justify-between gap-4 mb-6">
    <div>
      <h1 class="text-3xl lg:text-4xl font-bold tracking-tight">Gallery</h1>
    </div>
    <p class="text-xs text-on-surface-variant">2026.08.10 – 09.06 · Weekdays</p>
  </div>

  <section class="glass-panel rounded-[2rem] p-4 sm:p-5 mb-6">
    <div class="flex items-center gap-3">
      <button id="gallery-prev-day" type="button" class="icon-glass w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0" aria-label="이전 날짜">
        <i class="fa-solid fa-chevron-left"></i>
      </button>
      <div class="flex-1 min-w-0 text-center">
        <p id="gallery-day-count" class="text-[11px] font-bold text-primary mb-1">DAY 1 / 20</p>
        <label for="gallery-date-control" class="sr-only">갤러리 날짜</label>
        <select id="gallery-date-control" style="text-align:center;text-align-last:center" class="glass-input rounded-xl px-3 py-2 text-sm font-semibold w-full max-w-[220px] mx-auto"></select>
        <p id="gallery-date-label" class="text-xs text-on-surface-variant mt-1"></p>
      </div>
      <button id="gallery-next-day" type="button" class="icon-glass w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0" aria-label="다음 날짜">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>
  </section>

  <section class="mb-8">
    <h2 class="text-lg font-bold mb-3 px-1"><i class="fa-solid fa-hands-praying text-primary mr-2"></i>Prayer Gallery</h2>
    <div id="gallery-pray-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4"></div>
  </section>

  <section class="mb-7">
    <h2 class="text-lg font-bold mb-3 px-1"><i class="fa-solid fa-book-bible text-secondary mr-2"></i>Word Gallery</h2>
    <div id="gallery-word-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4"></div>
  </section>

  <nav id="gallery-pagination" class="flex items-center justify-center gap-2 pb-16" aria-label="학생 갤러리 페이지"></nav>
</template>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/auth-guard.js"></script>
<script src="assets/js/auth.js?v=3"></script>
<script src="assets/js/layout.js?v=6"></script>
<script src="assets/js/pray-word.js?v=4"></script>
<script src="assets/js/gallery.js?v=7"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    if (await requireAuth()) renderApp({ activePage: 'gallery' });
  });
</script>
</body>
</html>
