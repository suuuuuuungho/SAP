<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 - SAP 1기</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="assets/js/tailwind-config.js"></script>
<link href="assets/css/app.css" rel="stylesheet">
</head>
<body class="text-on-surface h-screen flex items-center justify-center px-4">
<div class="mesh-bg"></div>
<div class="w-full max-w-sm glass-panel rounded-[2rem] p-8">
  <div class="text-center mb-8">
    <div class="w-10 h-10 bg-gradient-to-br from-primary-container to-tertiary-container text-on-primary rounded-full text-sm flex items-center justify-center font-bold mx-auto mb-4">S</div>
    <h1 class="text-2xl font-bold tracking-tight">SAP 1기 로그인</h1>
    <p class="text-sm text-on-surface-variant mt-2">아이디와 비밀번호를 입력하세요.</p>
  </div>

  <form id="login-form" class="flex flex-col gap-3">
    <input
      type="text"
      id="username-input"
      required
      autocomplete="username"
      placeholder="아이디"
      class="glass-input w-full px-4 py-2.5 rounded-2xl text-sm"
    >
    <input
      type="password"
      id="password-input"
      required
      autocomplete="current-password"
      placeholder="비밀번호"
      class="glass-input w-full px-4 py-2.5 rounded-2xl text-sm"
    >
    <button
      type="submit"
      id="login-submit"
      class="pill-btn-primary w-full text-sm px-4 py-2.5 mt-2"
    >
      로그인
    </button>
  </form>

  <p id="login-status" class="text-sm text-center mt-4 hidden"></p>

  <div class="flex items-center justify-center gap-3 text-sm text-on-surface-variant mt-6">
    <a href="find-id.html" class="hover:text-on-surface">아이디 찾기</a>
    <span class="text-outline-variant">|</span>
    <a href="find-password.html" class="hover:text-on-surface">비밀번호 찾기</a>
    <span class="text-outline-variant">|</span>
    <a href="signup.html" class="text-primary font-medium hover:opacity-80">회원가입</a>
  </div>

  <a href="index.html" class="block text-center text-sm text-on-surface-variant hover:text-on-surface mt-6">
    ← Home으로 돌아가기
  </a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script>
  const form = document.getElementById('login-form');
  const usernameInput = document.getElementById('username-input');
  const passwordInput = document.getElementById('password-input');
  const submitBtn = document.getElementById('login-submit');
  const status = document.getElementById('login-status');

  function showStatus(message, isError) {
    status.textContent = message;
    status.classList.remove('hidden', 'text-error', 'text-on-surface-variant');
    status.classList.add(isError ? 'text-error' : 'text-on-surface-variant');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    if (!window.supabaseClient) {
      showStatus('Supabase 설정이 없습니다. assets/config.example.js를 assets/config.js로 복사하고 값을 채워주세요.', true);
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = '로그인 중...';

    const { data: email, error: lookupError } = await window.supabaseClient.rpc('get_login_email', {
      p_username: usernameInput.value.trim()
    });

    if (lookupError || !email) {
      submitBtn.disabled = false;
      submitBtn.textContent = '로그인';
      showStatus('아이디 또는 비밀번호가 올바르지 않습니다.', true);
      return;
    }

    const { error } = await window.supabaseClient.auth.signInWithPassword({
      email,
      password: passwordInput.value
    });

    submitBtn.disabled = false;
    submitBtn.textContent = '로그인';

    if (error) {
      showStatus('아이디 또는 비밀번호가 올바르지 않습니다.', true);
    } else {
      window.location.href = 'index.html';
    }
  });

  // If already logged in, skip straight to Home.
  (async () => {
    if (!window.supabaseClient) return;
    const { data: { session } } = await window.supabaseClient.auth.getSession();
    if (session) window.location.href = 'index.html';
  })();
</script>
</body>
</html>
