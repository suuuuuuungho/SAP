<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 - SAP 1기</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="assets/js/tailwind-config.js"></script>
<link href="assets/css/app.css" rel="stylesheet">
</head>
<body class="bg-white text-text-primary h-screen flex items-center justify-center px-4">
<div class="w-full max-w-sm">
  <div class="text-center mb-8">
    <div class="w-10 h-10 bg-gray-800 text-white rounded-lg text-sm flex items-center justify-center font-bold mx-auto mb-4">S</div>
    <h1 class="text-2xl font-bold tracking-tight">SAP 1기 로그인</h1>
    <p class="text-sm text-text-secondary mt-2">이메일로 매직 링크를 받아 로그인하세요.</p>
  </div>

  <form id="login-form" class="flex flex-col gap-3">
    <input
      type="email"
      id="email-input"
      required
      placeholder="you@example.com"
      class="w-full px-4 py-2.5 border border-border-color rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-accent focus:border-transparent"
    >
    <button
      type="submit"
      id="login-submit"
      class="w-full bg-accent text-white font-medium text-sm rounded-md px-4 py-2.5 hover:opacity-90 transition-opacity"
    >
      매직 링크 보내기
    </button>
  </form>

  <p id="login-status" class="text-sm text-center mt-4 hidden"></p>

  <a href="index.html" class="block text-center text-sm text-text-secondary hover:text-text-primary mt-6">
    ← Home으로 돌아가기
  </a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script>
  const form = document.getElementById('login-form');
  const emailInput = document.getElementById('email-input');
  const submitBtn = document.getElementById('login-submit');
  const status = document.getElementById('login-status');

  function showStatus(message, isError) {
    status.textContent = message;
    status.classList.remove('hidden', 'text-red-600', 'text-text-secondary');
    status.classList.add(isError ? 'text-red-600' : 'text-text-secondary');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    if (!window.supabaseClient) {
      showStatus('Supabase 설정이 없습니다. assets/config.example.js를 assets/config.js로 복사하고 값을 채워주세요.', true);
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = '전송 중...';

    const { error } = await window.supabaseClient.auth.signInWithOtp({
      email: emailInput.value,
      options: { emailRedirectTo: window.location.origin + window.location.pathname.replace('login.html', 'index.html') }
    });

    submitBtn.disabled = false;
    submitBtn.textContent = '매직 링크 보내기';

    if (error) {
      showStatus(error.message, true);
    } else {
      showStatus('메일함을 확인하세요. 로그인 링크를 보냈습니다.', false);
    }
  });

  // If already logged in, skip straight to Home.
  (async () => {
    if (!window.supabaseClient) return;
    const { data: { session } } = await window.supabaseClient.auth.getSession();
    if (session) window.location.href = 'index.html';
  })();
</script>
</body>
</html>
