<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hall of Fame - SAP 1기</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="assets/js/tailwind-config.js"></script>
<link href="assets/css/app.css" rel="stylesheet">
</head>
<body class="text-on-surface">
<div id="app"></div>
<template id="page-content">
  <div class="sticky top-0 z-30 -mx-4 sm:-mx-6 lg:-mx-8 -mt-4 md:-mt-8 lg:-mt-10 px-4 sm:px-6 lg:px-8 pt-4 md:pt-8 lg:pt-10 pb-3 mb-8 lg:mb-10 bg-surface/95 backdrop-blur-xl rounded-b-2xl shadow-sm">
    <div class="flex flex-wrap items-end justify-between gap-3 mb-5">
      <div>
        <h1 class="text-3xl lg:text-4xl font-bold tracking-tight">Hall of Fame</h1>
        <p class="text-sm text-on-surface-variant mt-1">기도 · 공부 · 말씀 · 예배 활동 랭킹</p>
      </div>
      <div class="flex items-center gap-2 text-[11px] text-on-surface-variant">
        <span class="relative flex h-2.5 w-2.5"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-quaternary-container opacity-75"></span><span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-quaternary"></span></span>
        <span id="hof-last-refreshed">실시간 집계</span>
      </div>
    </div>

    <div class="glass-panel rounded-full p-1 flex flex-nowrap text-[11px] sm:text-sm font-semibold w-full sm:w-fit" id="hof-tabs">
      <button type="button" data-hof-tab="1" class="flex-1 sm:flex-none px-1.5 sm:px-3.5 py-1.5 rounded-full whitespace-nowrap text-on-surface-variant transition-colors">Week1</button>
      <button type="button" data-hof-tab="2" class="flex-1 sm:flex-none px-1.5 sm:px-3.5 py-1.5 rounded-full whitespace-nowrap text-on-surface-variant transition-colors">Week2</button>
      <button type="button" data-hof-tab="3" class="flex-1 sm:flex-none px-1.5 sm:px-3.5 py-1.5 rounded-full whitespace-nowrap text-on-surface-variant transition-colors">Week3</button>
      <button type="button" data-hof-tab="4" class="flex-1 sm:flex-none px-1.5 sm:px-3.5 py-1.5 rounded-full whitespace-nowrap text-on-surface-variant transition-colors">Week4</button>
      <button type="button" data-hof-tab="total" class="flex-1 sm:flex-none px-1.5 sm:px-3.5 py-1.5 rounded-full whitespace-nowrap text-on-surface-variant transition-colors">전체누적</button>
    </div>
  </div>

  <section id="hof-growth-section" class="mb-10 lg:mb-14">
    <div class="relative overflow-hidden glass-panel rounded-[2rem] p-5 sm:p-7 mb-5">
      <div class="absolute -right-12 -top-16 w-48 h-48 rounded-full bg-primary-container/20 blur-3xl pointer-events-none"></div>
      <div class="absolute left-1/3 -bottom-20 w-52 h-52 rounded-full bg-secondary-container/20 blur-3xl pointer-events-none"></div>
      <div class="relative flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div class="flex items-center gap-4">
          <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-primary-container to-secondary text-white flex items-center justify-center shadow-lg shadow-primary/15"><i class="fa-solid fa-arrow-trend-up text-2xl"></i></div>
          <div><p class="text-[11px] font-bold tracking-[.16em] text-primary uppercase">Growth Spotlight</p><h2 class="text-xl sm:text-2xl font-bold mt-0.5">눈에 띄는 성장</h2><p class="text-xs text-on-surface-variant mt-1">같은 요일까지의 활동 시간을 비교한 상승률입니다.</p></div>
        </div>
        <div id="hof-growth-period" class="glass-card rounded-full px-4 py-2 text-xs font-bold text-on-surface-variant self-start sm:self-auto"></div>
      </div>
    </div>
    <div id="hof-growth-grid" class="grid grid-cols-1 xl:grid-cols-2 gap-4 lg:gap-6"></div>
  </section>

  <section class="mb-16">
    <div id="hof-ranking-grid" class="grid grid-cols-1 lg:grid-cols-2 gap-4 lg:gap-6"></div>
  </section>
</template>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/auth-guard.js"></script>
<script src="assets/js/auth.js?v=10"></script>
<script src="assets/js/layout.js?v=23"></script>
<script src="assets/js/profile-avatar.js?v=5"></script>
<script src="assets/js/hall-of-fame.js?v=8"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    if (await requireAuth()) renderApp({ activePage: 'hall-of-fame' });
  });
</script>
</body>
</html>
