<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비밀번호 찾기 - SAP 1기</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="assets/js/core/tailwind-config.js"></script>
<link href="assets/css/app.css" rel="stylesheet">
</head>
<body data-required-feature="password_reset" class="text-on-surface min-h-screen flex items-center justify-center px-4 py-10">
<div class="mesh-bg"></div>
<div class="w-full max-w-sm glass-panel rounded-[2rem] p-8">
  <div class="text-center mb-8">
    <div class="w-10 h-10 bg-gradient-to-br from-primary-container to-tertiary-container text-on-primary rounded-full text-sm flex items-center justify-center font-bold mx-auto mb-4">S</div>
    <h1 class="text-2xl font-bold tracking-tight">비밀번호 찾기</h1>
    <p id="step-description" class="text-sm text-on-surface-variant mt-2">가입한 전화번호로 인증번호를 받아주세요.</p>
  </div>

  <form id="identity-form" class="flex flex-col gap-3">
    <input type="text" id="username-input" required autocomplete="username" placeholder="아이디" class="glass-input w-full px-4 py-2.5 rounded-2xl text-sm">
    <input type="text" id="name-input" required autocomplete="name" placeholder="이름" class="glass-input w-full px-4 py-2.5 rounded-2xl text-sm">
    <input type="tel" id="phone-input" required autocomplete="tel" inputmode="tel" placeholder="전화번호" class="glass-input w-full px-4 py-2.5 rounded-2xl text-sm">
    <button type="submit" id="send-code-btn" class="pill-btn-primary w-full text-sm px-4 py-2.5">인증번호 받기</button>
  </form>

  <form id="verification-form" class="hidden flex-col gap-3">
    <div class="relative">
      <input type="text" id="verification-code-input" required inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6자리 인증번호" class="glass-input w-full px-4 py-2.5 pr-16 rounded-2xl text-sm tracking-[0.25em]">
      <span id="verification-timer" class="absolute right-4 top-1/2 -translate-y-1/2 text-xs font-semibold text-primary">03:00</span>
    </div>
    <button type="submit" id="verify-code-btn" class="pill-btn-primary w-full text-sm px-4 py-2.5">인증번호 확인</button>
    <button type="button" id="resend-code-btn" class="text-xs text-on-surface-variant hover:text-on-surface py-1" disabled>인증번호 다시 받기 <span id="resend-wait">(60초 후)</span></button>
  </form>

  <form id="new-password-form" class="hidden flex-col gap-3">
    <div class="flex items-center justify-center gap-2 text-sm text-primary font-semibold mb-1">
      <i class="fa-solid fa-circle-check"></i><span>전화번호 인증 완료</span>
    </div>
    <input type="password" id="new-password-input" required autocomplete="new-password" placeholder="새 비밀번호" class="glass-input w-full px-4 py-2.5 rounded-2xl text-sm">
    <input type="password" id="new-password-confirm-input" required autocomplete="new-password" placeholder="새 비밀번호 확인" class="glass-input w-full px-4 py-2.5 rounded-2xl text-sm">
    <p id="password-match-hint" class="hidden text-xs text-error">새 비밀번호가 일치하지 않습니다.</p>
    <button type="submit" id="reset-password-btn" class="pill-btn-primary w-full text-sm px-4 py-2.5">비밀번호 변경</button>
  </form>

  <p id="find-password-status" class="text-sm text-center mt-4 hidden" aria-live="polite"></p>

  <div class="flex items-center justify-center gap-3 text-sm text-on-surface-variant mt-6">
    <a href="login.html" class="text-primary font-medium hover:opacity-80">로그인으로 돌아가기</a>
    <span class="text-outline-variant">|</span>
    <a href="find-id.html" class="hover:text-on-surface">아이디 찾기</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script src="assets/js/core/supabase-client.js"></script>
<script src="assets/js/core/feature-guard.js?v=1"></script>
<script src="assets/js/core/auth-password.js?v=1"></script>
<script>
  const identityForm = document.getElementById('identity-form');
  const verificationForm = document.getElementById('verification-form');
  const newPasswordForm = document.getElementById('new-password-form');
  const usernameInput = document.getElementById('username-input');
  const nameInput = document.getElementById('name-input');
  const phoneInput = document.getElementById('phone-input');
  const codeInput = document.getElementById('verification-code-input');
  const newPasswordInput = document.getElementById('new-password-input');
  const newPasswordConfirmInput = document.getElementById('new-password-confirm-input');
  const passwordMatchHint = document.getElementById('password-match-hint');
  const statusEl = document.getElementById('find-password-status');
  const descriptionEl = document.getElementById('step-description');
  const timerEl = document.getElementById('verification-timer');
  const resendBtn = document.getElementById('resend-code-btn');
  const resendWait = document.getElementById('resend-wait');

  let challengeId = '';
  let resetToken = '';
  let timerHandle = null;
  let expiresAt = 0;
  let resendAvailableAt = 0;

  function showStatus(message, isError = false) {
    statusEl.textContent = message;
    statusEl.classList.remove('hidden', 'text-error', 'text-on-surface-variant', 'text-primary');
    statusEl.classList.add(isError ? 'text-error' : 'text-primary');
  }

  function clearStatus() {
    statusEl.classList.add('hidden');
  }

  function setBusy(button, busy, busyText, normalText) {
    button.disabled = busy;
    button.textContent = busy ? busyText : normalText;
  }

  async function invoke(body) {
    if (!window.supabaseClient) throw new Error('Supabase 설정이 없습니다.');
    const { data, error } = await window.supabaseClient.functions.invoke('reset-password-no-email', { body });
    if (error) throw error;
    if (!data?.ok) throw new Error(data?.message || '요청을 처리하지 못했습니다.');
    return data;
  }

  function startTimer() {
    clearInterval(timerHandle);
    timerHandle = setInterval(() => {
      const now = Date.now();
      const left = Math.max(0, Math.ceil((expiresAt - now) / 1000));
      const minutes = String(Math.floor(left / 60)).padStart(2, '0');
      const seconds = String(left % 60).padStart(2, '0');
      timerEl.textContent = `${minutes}:${seconds}`;
      if (left === 0) timerEl.classList.add('text-error');

      const resendLeft = Math.max(0, Math.ceil((resendAvailableAt - now) / 1000));
      resendBtn.disabled = resendLeft > 0;
      resendWait.textContent = resendLeft > 0 ? `(${resendLeft}초 후)` : '';
    }, 250);
  }

  async function sendCode() {
    const button = document.getElementById('send-code-btn');
    const resend = !identityForm.classList.contains('hidden');
    if (resend) setBusy(button, true, '발송 중...', '인증번호 받기');
    else setBusy(resendBtn, true, '발송 중...', '인증번호 다시 받기');

    try {
      const data = await invoke({
        action: 'send',
        username: usernameInput.value.trim(),
        name: nameInput.value.trim(),
        phone: phoneInput.value.trim()
      });
      challengeId = data.challengeId;
      expiresAt = Date.now() + (data.expiresIn || 180) * 1000;
      resendAvailableAt = Date.now() + (data.resendIn || 60) * 1000;
      identityForm.classList.add('hidden');
      verificationForm.classList.remove('hidden');
      verificationForm.classList.add('flex');
      descriptionEl.textContent = '문자로 받은 6자리 인증번호를 입력해주세요.';
      timerEl.classList.remove('text-error');
      codeInput.value = '';
      codeInput.focus();
      showStatus('인증번호를 발송했습니다. 3분 안에 입력해주세요.');
      startTimer();
    } catch (error) {
      showStatus(error.message || '인증번호를 보내지 못했습니다.', true);
    } finally {
      setBusy(button, false, '발송 중...', '인증번호 받기');
      if (verificationForm.classList.contains('flex')) {
        resendBtn.textContent = '인증번호 다시 받기 ';
        resendBtn.appendChild(resendWait);
      }
    }
  }

  identityForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    clearStatus();
    await sendCode();
  });

  resendBtn.addEventListener('click', async () => {
    if (resendBtn.disabled) return;
    await sendCode();
  });

  codeInput.addEventListener('input', () => {
    codeInput.value = codeInput.value.replace(/\D/g, '').slice(0, 6);
  });

  verificationForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    clearStatus();
    if (codeInput.value.length !== 6) {
      showStatus('6자리 인증번호를 입력해주세요.', true);
      return;
    }
    const button = document.getElementById('verify-code-btn');
    setBusy(button, true, '확인 중...', '인증번호 확인');
    try {
      const data = await invoke({ action: 'verify', challengeId, code: codeInput.value });
      resetToken = data.resetToken;
      clearInterval(timerHandle);
      verificationForm.classList.add('hidden');
      verificationForm.classList.remove('flex');
      newPasswordForm.classList.remove('hidden');
      newPasswordForm.classList.add('flex');
      descriptionEl.textContent = '사용할 새 비밀번호를 입력해주세요.';
      showStatus('인증이 완료되었습니다.');
      newPasswordInput.focus();
    } catch (error) {
      showStatus(error.message || '인증번호를 확인해주세요.', true);
    } finally {
      setBusy(button, false, '확인 중...', '인증번호 확인');
    }
  });

  newPasswordForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    clearStatus();
    passwordMatchHint.classList.add('hidden');
    if (newPasswordInput.value !== newPasswordConfirmInput.value) {
      passwordMatchHint.classList.remove('hidden');
      return;
    }
    const button = document.getElementById('reset-password-btn');
    setBusy(button, true, '변경 중...', '비밀번호 변경');
    try {
      await invoke({
        action: 'reset',
        challengeId,
        resetToken,
        password: normalizeAuthPassword(newPasswordInput.value)
      });
      newPasswordForm.innerHTML = '<div class="text-center py-4"><i class="fa-solid fa-circle-check text-4xl text-primary mb-3"></i><p class="font-bold">비밀번호가 변경되었습니다.</p><p class="text-sm text-on-surface-variant mt-1">새 비밀번호로 로그인해주세요.</p><a href="login.html" class="pill-btn-primary inline-block mt-5 px-6 py-2.5 text-sm">로그인하기</a></div>';
      descriptionEl.textContent = '비밀번호 변경 완료';
      clearStatus();
    } catch (error) {
      showStatus(error.message || '비밀번호를 변경하지 못했습니다.', true);
      setBusy(button, false, '변경 중...', '비밀번호 변경');
    }
  });
</script>
</body>
</html>
