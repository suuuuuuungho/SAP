<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비밀번호 찾기 - SAP 1기</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="assets/js/tailwind-config.js"></script>
<link href="assets/css/app.css" rel="stylesheet">
</head>
<body class="text-on-surface min-h-screen flex items-center justify-center px-4 py-10">
<div class="mesh-bg"></div>
<div class="w-full max-w-sm glass-panel rounded-[2rem] p-8">
  <div class="text-center mb-8">
    <div class="w-10 h-10 bg-gradient-to-br from-primary-container to-tertiary-container text-on-primary rounded-full text-sm flex items-center justify-center font-bold mx-auto mb-4">S</div>
    <h1 class="text-2xl font-bold tracking-tight">비밀번호 찾기</h1>
    <p class="text-sm text-on-surface-variant mt-2">가입 정보를 확인하고 새 비밀번호를 설정합니다.</p>
  </div>

  <form id="find-password-form" class="flex flex-col gap-3">
    <input
      type="text"
      id="username-input"
      required
      autocomplete="username"
      placeholder="아이디"
      class="glass-input w-full px-4 py-2.5 rounded-2xl text-sm"
    >
    <input type="text" id="name-input" required autocomplete="name" placeholder="이름" class="glass-input w-full px-4 py-2.5 rounded-2xl text-sm">
    <input type="tel" id="phone-input" required autocomplete="tel" placeholder="전화번호" class="glass-input w-full px-4 py-2.5 rounded-2xl text-sm">
    <input type="password" id="new-password-input" required autocomplete="new-password" placeholder="새 비밀번호" class="glass-input w-full px-4 py-2.5 rounded-2xl text-sm">
    <input type="password" id="new-password-confirm-input" required autocomplete="new-password" placeholder="새 비밀번호 확인" class="glass-input w-full px-4 py-2.5 rounded-2xl text-sm">
    <p id="password-match-hint" class="hidden text-xs text-error">새 비밀번호가 일치하지 않습니다.</p>
    <button
      type="submit"
      id="find-password-submit"
      class="pill-btn-primary w-full text-sm px-4 py-2.5"
    >
      비밀번호 변경
    </button>
  </form>

  <p id="find-password-status" class="text-sm text-center mt-4 hidden"></p>

  <div class="flex items-center justify-center gap-3 text-sm text-on-surface-variant mt-6">
    <a href="login.html" class="text-primary font-medium hover:opacity-80">로그인으로 돌아가기</a>
    <span class="text-outline-variant">|</span>
    <a href="find-id.html" class="hover:text-on-surface">아이디 찾기</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script>
  const form = document.getElementById('find-password-form');
  const usernameInput = document.getElementById('username-input');
  const nameInput = document.getElementById('name-input');
  const phoneInput = document.getElementById('phone-input');
  const newPasswordInput = document.getElementById('new-password-input');
  const newPasswordConfirmInput = document.getElementById('new-password-confirm-input');
  const passwordMatchHint = document.getElementById('password-match-hint');
  const submitBtn = document.getElementById('find-password-submit');
  const status = document.getElementById('find-password-status');

  function showStatus(message, isError) {
    status.textContent = message;
    status.classList.remove('hidden', 'text-error', 'text-on-surface-variant');
    status.classList.add(isError ? 'text-error' : 'text-on-surface-variant');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    passwordMatchHint.classList.add('hidden');

    if (newPasswordInput.value !== newPasswordConfirmInput.value) {
      passwordMatchHint.classList.remove('hidden');
      return;
    }

    if (!window.supabaseClient) {
      showStatus('Supabase 설정이 없습니다. assets/config.example.js를 assets/config.js로 복사하고 값을 채워주세요.', true);
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = '변경 중...';

    const { error } = await window.supabaseClient.functions.invoke('reset-password-no-email', { body: {
      username: usernameInput.value.trim(),
      name: nameInput.value.trim(),
      phone: phoneInput.value.trim(),
      password: newPasswordInput.value
    }});

    submitBtn.disabled = false;
    submitBtn.textContent = '비밀번호 변경';
    if (error) {
      showStatus('정보를 확인하거나 잠시 후 다시 시도해주세요.', true);
      return;
    }

    // 계정 존재 여부와 개인정보 일치 여부를 구분하지 않아 계정 유추를 막습니다.
    showStatus('입력 정보가 일치하면 비밀번호가 변경되었습니다. 새 비밀번호로 로그인해주세요.', false);
  });
</script>
</body>
</html>
