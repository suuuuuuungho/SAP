<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비밀번호 찾기 - SAP 1기</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="assets/js/tailwind-config.js"></script>
<link href="assets/css/app.css" rel="stylesheet">
</head>
<body class="text-on-surface h-screen flex items-center justify-center px-4">
<div class="mesh-bg"></div>
<div class="w-full max-w-sm glass-panel rounded-[2rem] p-8">
  <div class="text-center mb-8">
    <div class="w-10 h-10 bg-gradient-to-br from-primary-container to-tertiary-container text-on-primary rounded-full text-sm flex items-center justify-center font-bold mx-auto mb-4">S</div>
    <h1 class="text-2xl font-bold tracking-tight">비밀번호 찾기</h1>
    <p class="text-sm text-on-surface-variant mt-2">아이디를 입력하면 가입 시 등록한 이메일로 재설정 링크를 보내드립니다.</p>
  </div>

  <form id="find-password-form" class="flex flex-col gap-3">
    <input
      type="text"
      id="username-input"
      required
      autocomplete="username"
      placeholder="아이디"
      class="glass-input w-full px-4 py-2.5 rounded-2xl text-sm"
    >
    <button
      type="submit"
      id="find-password-submit"
      class="pill-btn-primary w-full text-sm px-4 py-2.5"
    >
      재설정 링크 보내기
    </button>
  </form>

  <p id="find-password-status" class="text-sm text-center mt-4 hidden"></p>

  <div class="flex items-center justify-center gap-3 text-sm text-on-surface-variant mt-6">
    <a href="login.html" class="text-primary font-medium hover:opacity-80">로그인으로 돌아가기</a>
    <span class="text-outline-variant">|</span>
    <a href="find-id.html" class="hover:text-on-surface">아이디 찾기</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script>
  const form = document.getElementById('find-password-form');
  const usernameInput = document.getElementById('username-input');
  const submitBtn = document.getElementById('find-password-submit');
  const status = document.getElementById('find-password-status');

  function showStatus(message, isError) {
    status.textContent = message;
    status.classList.remove('hidden', 'text-error', 'text-on-surface-variant');
    status.classList.add(isError ? 'text-error' : 'text-on-surface-variant');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    if (!window.supabaseClient) {
      showStatus('Supabase 설정이 없습니다. assets/config.example.js를 assets/config.js로 복사하고 값을 채워주세요.', true);
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = '전송 중...';

    const { data: email } = await window.supabaseClient.rpc('get_login_email', {
      p_username: usernameInput.value.trim()
    });

    if (email) {
      await window.supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + window.location.pathname.replace('find-password.html', 'reset-password.html')
      });
    }

    submitBtn.disabled = false;
    submitBtn.textContent = '재설정 링크 보내기';

    // 아이디 존재 여부와 무관하게 동일한 메시지를 보여줘 아이디 유추를 막습니다.
    showStatus('입력하신 아이디로 등록된 이메일이 있다면 재설정 링크를 보냈습니다.', false);
  });
</script>
</body>
</html>
