<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile - SAP 1기</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="assets/js/tailwind-config.js"></script>
<link href="assets/css/app.css" rel="stylesheet">
</head>
<body class="text-on-surface">
<div id="app"></div>
<template id="page-content">
  <div class="flex items-center justify-between gap-3 mb-6">
    <div>
      <h1 class="text-3xl lg:text-4xl font-bold tracking-tight">Profile</h1>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-[0.85fr_1.15fr] gap-5 lg:gap-6">
    <section class="glass-card rounded-[1.5rem] p-6">
      <div class="flex flex-col items-center text-center mt-2">
        <div id="profile-avatar-preview" class="w-32 h-32 rounded-full bg-gradient-to-br from-primary-container to-tertiary-container text-white flex items-center justify-center text-4xl font-bold overflow-hidden shadow-lg">?</div>
        <p class="font-bold text-xl mt-4"><span id="profile-display-name">불러오는 중...</span><span id="profile-role-badge"></span></p>
        <p id="profile-meta" class="text-sm text-on-surface-variant mt-1"></p>
        <input id="profile-photo-input" type="file" accept="image/jpeg,image/png,image/webp" class="hidden">
        <div class="flex items-center justify-center gap-2 mt-5">
          <button id="profile-photo-select" type="button" class="pill-btn-primary px-5 py-2.5 text-sm"><i class="fa-solid fa-camera mr-2"></i>사진 변경</button>
          <button id="profile-photo-delete" type="button" class="hidden glass-card rounded-full px-5 py-2.5 text-sm text-error hover:bg-error/10"><i class="fa-regular fa-trash-can mr-2"></i>사진 삭제</button>
        </div>
        <p class="text-xs text-on-surface-variant mt-3">JPG, PNG, WebP · 최대 5MB</p>
        <p id="profile-photo-status" class="hidden text-sm mt-3" aria-live="polite"></p>
      </div>
    </section>

    <section class="glass-card rounded-[1.5rem] p-6">
      <h2 class="text-lg font-bold">비밀번호 변경</h2>
      <form id="profile-password-form" class="flex flex-col gap-4 mt-6">
        <div>
          <label for="profile-new-password-input" class="block text-sm font-medium mb-1.5">새 비밀번호</label>
          <input id="profile-new-password-input" type="password" required autocomplete="new-password" class="glass-input w-full px-4 py-2.5 rounded-2xl text-sm">
        </div>
        <div>
          <label for="profile-new-password-confirm-input" class="block text-sm font-medium mb-1.5">새 비밀번호 확인</label>
          <input id="profile-new-password-confirm-input" type="password" required autocomplete="new-password" class="glass-input w-full px-4 py-2.5 rounded-2xl text-sm">
          <p id="profile-password-match" class="hidden text-xs text-error mt-1">새 비밀번호가 일치하지 않습니다.</p>
        </div>
        <button id="profile-password-submit" type="submit" class="pill-btn-primary px-6 py-2.5 text-sm mt-1">비밀번호 변경</button>
        <p id="profile-password-status" class="hidden text-sm text-center" aria-live="polite"></p>
      </form>
    </section>

    <section class="glass-card rounded-[1.5rem] p-6 lg:col-span-2 border border-error/20">
      <h2 class="text-lg font-bold text-error">회원탈퇴</h2>
      <p class="text-sm text-on-surface-variant mt-1">탈퇴하면 기도·말씀·공부·예배 기록, 댓글과 모든 사진이 영구적으로 삭제됩니다.</p>
      <button id="profile-delete-open" type="button" class="mt-5 rounded-full px-5 py-2.5 text-sm font-semibold text-error bg-error/10 hover:bg-error/15">회원탈퇴</button>
      <div id="profile-delete-confirm-wrap" class="hidden mt-5 rounded-2xl bg-error/5 p-4">
        <label for="profile-delete-confirm-input" class="block text-sm font-medium">계속하려면 <strong>탈퇴</strong>를 입력해주세요.</label>
        <input id="profile-delete-confirm-input" type="text" autocomplete="off" placeholder="탈퇴" class="glass-input w-full px-4 py-2.5 rounded-2xl text-sm mt-2">
        <div class="flex gap-2 mt-3">
          <button id="profile-delete-cancel" type="button" class="glass-card rounded-full flex-1 py-2.5 text-sm">취소</button>
          <button id="profile-delete-submit" type="button" disabled class="rounded-full flex-1 py-2.5 text-sm font-bold bg-error text-white disabled:opacity-40">모든 기록 삭제 및 탈퇴</button>
        </div>
        <p id="profile-delete-status" class="hidden text-sm text-error text-center mt-3" aria-live="polite"></p>
      </div>
    </section>
  </div>
</template>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/auth-guard.js"></script>
<script src="assets/js/auth.js?v=7"></script>
<script src="assets/js/layout.js?v=15"></script>
<script src="assets/js/auth-password.js?v=1"></script>
<script src="assets/js/profile.js?v=3"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    if (await requireAuth()) renderApp({ activePage: 'profile' });
  });
</script>
</body>
</html>
