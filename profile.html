<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile - SAP 1기</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="assets/js/tailwind-config.js"></script>
<link href="assets/css/app.css" rel="stylesheet">
</head>
<body class="text-on-surface">
<div id="app"></div>
<template id="page-content">
  <div class="flex items-center justify-between gap-3 mb-6">
    <div>
      <h1 class="text-3xl lg:text-4xl font-bold tracking-tight">Profile</h1>
      <p class="text-sm text-on-surface-variant mt-1">내 정보와 계정 보안을 관리합니다.</p>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-[0.85fr_1.15fr] gap-5 lg:gap-6">
    <section class="glass-card rounded-[1.5rem] p-6">
      <h2 class="text-lg font-bold">Profile Photo</h2>
      <p class="text-sm text-on-surface-variant mt-1">나를 나타내는 프로필 사진입니다.</p>
      <div class="flex flex-col items-center text-center mt-7">
        <div id="profile-avatar-preview" class="w-32 h-32 rounded-full bg-gradient-to-br from-primary-container to-tertiary-container text-white flex items-center justify-center text-4xl font-bold overflow-hidden shadow-lg">?</div>
        <p id="profile-display-name" class="font-bold text-xl mt-4">불러오는 중...</p>
        <p id="profile-meta" class="text-sm text-on-surface-variant mt-1"></p>
        <input id="profile-photo-input" type="file" accept="image/jpeg,image/png,image/webp" class="hidden">
        <button id="profile-photo-select" type="button" class="pill-btn-primary px-6 py-2.5 text-sm mt-5"><i class="fa-solid fa-camera mr-2"></i>사진 변경</button>
        <p class="text-xs text-on-surface-variant mt-3">JPG, PNG, WebP · 최대 5MB</p>
        <p id="profile-photo-status" class="hidden text-sm mt-3" aria-live="polite"></p>
      </div>
    </section>

    <section class="glass-card rounded-[1.5rem] p-6">
      <h2 class="text-lg font-bold">Change Password</h2>
      <p class="text-sm text-on-surface-variant mt-1">현재 비밀번호 확인 후 새 비밀번호로 변경합니다.</p>
      <form id="profile-password-form" class="flex flex-col gap-4 mt-6">
        <div>
          <label for="current-password-input" class="block text-sm font-medium mb-1.5">현재 비밀번호</label>
          <input id="current-password-input" type="password" required autocomplete="current-password" class="glass-input w-full px-4 py-2.5 rounded-2xl text-sm">
        </div>
        <div>
          <label for="profile-new-password-input" class="block text-sm font-medium mb-1.5">새 비밀번호</label>
          <input id="profile-new-password-input" type="password" required autocomplete="new-password" class="glass-input w-full px-4 py-2.5 rounded-2xl text-sm">
        </div>
        <div>
          <label for="profile-new-password-confirm-input" class="block text-sm font-medium mb-1.5">새 비밀번호 확인</label>
          <input id="profile-new-password-confirm-input" type="password" required autocomplete="new-password" class="glass-input w-full px-4 py-2.5 rounded-2xl text-sm">
          <p id="profile-password-match" class="hidden text-xs text-error mt-1">새 비밀번호가 일치하지 않습니다.</p>
        </div>
        <button id="profile-password-submit" type="submit" class="pill-btn-primary px-6 py-2.5 text-sm mt-1">비밀번호 변경</button>
        <p id="profile-password-status" class="hidden text-sm text-center" aria-live="polite"></p>
      </form>
    </section>
  </div>
</template>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/auth-guard.js"></script>
<script src="assets/js/auth.js?v=4"></script>
<script src="assets/js/layout.js?v=7"></script>
<script src="assets/js/auth-password.js?v=1"></script>
<script src="assets/js/profile.js?v=1"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    if (await requireAuth()) renderApp({ activePage: 'profile' });
  });
</script>
</body>
</html>
