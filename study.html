<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study - SAP 1기</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="assets/js/tailwind-config.js"></script>
<link href="assets/css/app.css" rel="stylesheet">
</head>
<body class="text-on-surface">
<div id="app"></div>
<template id="page-content">
  <!-- Header + 모드 스위처 -->
  <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
    <h1 class="text-3xl lg:text-4xl font-bold tracking-tight">Study</h1>
    <div class="glass-panel rounded-full p-1 flex text-sm font-semibold" id="study-mode-tabs">
      <button type="button" id="study-mode-list" data-mode="list" class="px-3.5 py-1.5 rounded-full nav-pill-active transition-colors">목록</button>
      <button type="button" id="study-mode-flashcard" data-mode="flashcard" class="px-3.5 py-1.5 rounded-full text-on-surface-variant transition-colors">암기카드</button>
      <button type="button" id="study-mode-quiz" data-mode="quiz" class="px-3.5 py-1.5 rounded-full text-on-surface-variant transition-colors">퀴즈</button>
    </div>
  </div>

  <!-- 레벨 셀렉터 (가로 스크롤 칩) -->
  <div class="mb-3 -mx-4 px-4 sm:mx-0 sm:px-0 overflow-x-auto scrollbar-hide">
    <div id="study-level-selector" class="flex gap-2 w-max pb-1"></div>
  </div>

  <!-- Day 셀렉터 (가로 스크롤 칩) -->
  <div class="mb-6 -mx-4 px-4 sm:mx-0 sm:px-0 overflow-x-auto scrollbar-hide">
    <div id="study-day-selector" class="flex gap-2 w-max pb-1"></div>
  </div>

  <!-- 모드별 콘텐츠가 여기로 스왑됨 -->
  <div id="study-content" class="mb-16"></div>
</template>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/auth-guard.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/layout.js?v=3"></script>
<script src="assets/js/study.js?v=2"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    if (await requireAuth()) renderApp({ activePage: 'study' });
  });
</script>
</body>
</html>
