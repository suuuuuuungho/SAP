<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study - SAP 1기</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="assets/js/tailwind-config.js"></script>
<link href="assets/css/app.css" rel="stylesheet">
</head>
<body class="text-on-surface">
<div id="app"></div>
<template id="page-content">
  <div class="sticky top-0 z-30 -mx-2 px-2 pt-1 pb-2 mb-6 bg-surface/95 backdrop-blur-xl rounded-b-2xl">
    <!-- Header + 모드 스위처 -->
    <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
      <h1 class="text-3xl lg:text-4xl font-bold tracking-tight">Study</h1>
      <div class="glass-panel rounded-full p-1 flex text-sm font-semibold" id="study-mode-tabs">
        <button type="button" id="study-mode-exam" data-mode="exam" class="px-3.5 py-1.5 rounded-full text-on-surface-variant transition-colors">단어 시험</button>
        <button type="button" id="study-mode-list" data-mode="list" class="px-3.5 py-1.5 rounded-full nav-pill-active transition-colors">목록</button>
        <button type="button" id="study-mode-flashcard" data-mode="flashcard" class="px-3.5 py-1.5 rounded-full text-on-surface-variant transition-colors">암기카드</button>
        <button type="button" id="study-mode-quiz" data-mode="quiz" class="px-3.5 py-1.5 rounded-full text-on-surface-variant transition-colors">퀴즈</button>
      </div>
    </div>

    <!-- Lv.1 전용 단어장 + Day 선택 (단어 시험 모드에서는 숨김) -->
    <div id="study-daybar" class="flex items-center justify-between gap-3">
      <span class="glass-card rounded-full px-4 py-1.5 text-xs sm:text-sm font-semibold nav-pill-active whitespace-nowrap">Lv.1</span>
      <select id="study-day-selector" class="glass-input rounded-full px-4 py-1.5 text-xs sm:text-sm font-semibold flex-shrink-0"></select>
    </div>
  </div>

  <!-- 모드별 콘텐츠가 여기로 스왑됨 -->
  <div id="study-content" class="mb-16"></div>
</template>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/auth-guard.js"></script>
<script src="assets/js/auth.js?v=10"></script>
<script src="assets/js/layout.js?v=28"></script>
<script src="assets/js/study.js?v=9"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    if (await requireAuth()) renderApp({ activePage: 'study' });
  });
</script>
</body>
</html>
