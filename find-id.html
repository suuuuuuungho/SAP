<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아이디 찾기 - SAP 1기</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="assets/js/tailwind-config.js"></script>
<link href="assets/css/app.css" rel="stylesheet">
</head>
<body class="bg-white text-text-primary h-screen flex items-center justify-center px-4">
<div class="w-full max-w-sm">
  <div class="text-center mb-8">
    <div class="w-10 h-10 bg-gray-800 text-white rounded-lg text-sm flex items-center justify-center font-bold mx-auto mb-4">S</div>
    <h1 class="text-2xl font-bold tracking-tight">아이디 찾기</h1>
    <p class="text-sm text-text-secondary mt-2">가입 시 등록한 이름과 전화번호를 입력하세요.</p>
  </div>

  <form id="find-id-form" class="flex flex-col gap-3">
    <input
      type="text"
      id="name-input"
      required
      autocomplete="name"
      placeholder="이름"
      class="w-full px-4 py-2.5 border border-border-color rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-accent focus:border-transparent"
    >
    <input
      type="tel"
      id="phone-input"
      required
      autocomplete="tel"
      placeholder="전화번호 (010-0000-0000)"
      class="w-full px-4 py-2.5 border border-border-color rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-accent focus:border-transparent"
    >
    <button
      type="submit"
      id="find-id-submit"
      class="w-full bg-accent text-white font-medium text-sm rounded-md px-4 py-2.5 hover:opacity-90 transition-opacity"
    >
      아이디 찾기
    </button>
  </form>

  <div id="result-box" class="hidden mt-6 border border-border-color rounded-md p-4 text-center">
    <p class="text-sm text-text-secondary mb-1">회원님의 아이디는</p>
    <p id="result-username" class="text-lg font-bold text-text-primary"></p>
    <p class="text-sm text-text-secondary mt-1">입니다.</p>
  </div>

  <p id="find-id-status" class="text-sm text-center mt-4 hidden"></p>

  <div class="flex items-center justify-center gap-3 text-sm text-text-secondary mt-6">
    <a href="login.html" class="text-accent font-medium hover:opacity-80">로그인으로 돌아가기</a>
    <span class="text-border-color">|</span>
    <a href="find-password.html" class="hover:text-text-primary">비밀번호 찾기</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script>
  const form = document.getElementById('find-id-form');
  const nameInput = document.getElementById('name-input');
  const phoneInput = document.getElementById('phone-input');
  const submitBtn = document.getElementById('find-id-submit');
  const status = document.getElementById('find-id-status');
  const resultBox = document.getElementById('result-box');
  const resultUsername = document.getElementById('result-username');

  function showStatus(message, isError) {
    status.textContent = message;
    status.classList.remove('hidden', 'text-red-600', 'text-text-secondary');
    status.classList.add(isError ? 'text-red-600' : 'text-text-secondary');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    resultBox.classList.add('hidden');
    status.classList.add('hidden');

    if (!window.supabaseClient) {
      showStatus('Supabase 설정이 없습니다. assets/config.example.js를 assets/config.js로 복사하고 값을 채워주세요.', true);
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = '조회 중...';

    const { data: username, error } = await window.supabaseClient.rpc('find_username', {
      p_name: nameInput.value.trim(),
      p_phone: phoneInput.value.trim()
    });

    submitBtn.disabled = false;
    submitBtn.textContent = '아이디 찾기';

    if (error || !username) {
      showStatus('일치하는 회원 정보가 없습니다.', true);
      return;
    }

    resultUsername.textContent = username;
    resultBox.classList.remove('hidden');
  });
</script>
</body>
</html>
