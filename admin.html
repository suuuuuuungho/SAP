<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - SAP 1기</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="assets/js/tailwind-config.js"></script>
<link href="assets/css/app.css" rel="stylesheet">
</head>
<body class="text-on-surface">
<div id="app"></div>
<template id="page-content">
  <div class="flex flex-wrap items-end justify-between gap-4 mb-6 lg:mb-8">
    <div><p class="text-xs font-bold tracking-[.2em] text-primary uppercase mb-2">SAP Operations</p><h1 class="text-3xl lg:text-4xl font-bold tracking-tight">Admin Console</h1></div>
    <div class="glass-card rounded-full px-4 py-2 text-xs text-on-surface-variant"><span class="inline-block w-2 h-2 rounded-full bg-quaternary mr-2"></span>Live workspace</div>
  </div>
  <p id="admin-status" class="hidden text-sm mb-4"></p>
  <div id="admin-access-denied" class="hidden glass-panel rounded-[2rem] p-12 text-center"><i class="fa-solid fa-lock text-3xl text-error mb-3"></i><p class="font-bold">관리자 권한이 필요합니다.</p></div>
  <div id="admin-content" class="hidden mb-16">
    <section data-admin-panel="board" class="admin-panel grid grid-cols-1 xl:grid-cols-2 gap-6">
      <section class="glass-panel rounded-[2rem] p-6">
      <h2 class="text-xl font-bold mb-1">Messages</h2><p class="text-xs text-on-surface-variant mb-5">전체 공지 또는 한 명에게만 보이는 메시지를 전송합니다.</p>
      <form id="admin-message-form" class="flex flex-col gap-3 mb-6">
        <select id="admin-message-recipient" class="glass-input rounded-2xl px-4 py-2 text-sm"></select>
        <textarea id="admin-message-body" class="glass-input rounded-2xl px-4 py-3 text-sm min-h-28" maxlength="500" placeholder="전달할 메시지" required></textarea>
        <label class="text-xs text-on-surface-variant">종료 시각(선택)<input id="admin-message-expires" type="datetime-local" class="glass-input rounded-xl px-3 py-2 text-sm w-full mt-1"></label>
        <div class="flex gap-2">
          <button id="admin-message-submit" class="pill-btn-primary py-2.5 text-sm flex-1" type="submit">메시지 전송</button>
          <button id="admin-message-edit-cancel" class="hidden glass-card rounded-full px-5 py-2.5 text-sm text-on-surface-variant" type="button">취소</button>
        </div>
      </form>
      <div id="admin-message-list" class="flex flex-col gap-3"></div>
      </section><section class="glass-panel rounded-[2rem] p-6">
      <h2 class="text-xl font-bold mb-1">Bible Verse</h2><p class="text-xs text-on-surface-variant mb-5">Home 상단 전광판에 표시할 대표 말씀입니다.</p>
      <form id="admin-verse-form" class="flex flex-col gap-3 mb-6">
        <div class="glass-card rounded-2xl p-4 flex flex-col gap-3">
          <p class="text-xs font-bold text-secondary">API.Bible 구절 찾기</p>
          <select id="admin-bible-version" class="glass-input rounded-xl px-3 py-2 text-sm"><option value="">번역본 불러오는 중...</option></select>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
            <select id="admin-bible-book" class="glass-input rounded-xl px-2 py-2 text-sm col-span-2 sm:col-span-2"></select>
            <input id="admin-bible-chapter" type="number" min="1" class="glass-input rounded-xl px-3 py-2 text-sm" placeholder="장">
            <input id="admin-bible-verse" type="number" min="1" class="glass-input rounded-xl px-3 py-2 text-sm" placeholder="절">
          </div>
          <button id="admin-bible-lookup" type="button" class="glass-card rounded-full py-2.5 text-sm font-semibold text-secondary">구절 불러오기</button>
          <p id="admin-bible-lookup-status" class="hidden text-xs text-on-surface-variant"></p>
        </div>
        <input id="admin-verse-reference" class="glass-input rounded-2xl px-4 py-2 text-sm" maxlength="100" placeholder="예: 빌립보서 4:13" required>
        <textarea id="admin-verse-text" class="glass-input rounded-2xl px-4 py-3 text-sm min-h-28" maxlength="1000" placeholder="성경구절 본문" required></textarea>
        <button class="pill-btn-primary py-2.5 text-sm" type="submit">대표 말씀 등록</button>
      </form>
      <div id="admin-verse-list" class="flex flex-col gap-3"></div>
      </section>
    </section>

    <section data-admin-panel="gallery" class="admin-panel hidden">
      <div class="glass-panel rounded-[2rem] p-5 sm:p-7"><div class="flex flex-wrap items-end justify-between gap-4 mb-6"><div><h2 class="text-2xl font-bold">Gallery</h2><p class="text-sm text-on-surface-variant mt-1">게시물을 검토하고 숨기거나 완전히 삭제합니다.</p></div><div class="flex gap-2"><input id="admin-gallery-date" type="date" value="2026-08-10" min="2026-08-10" max="2026-09-06" class="glass-input rounded-xl px-3 py-2 text-sm"><button id="admin-gallery-refresh" class="pill-btn-primary px-5 text-sm">불러오기</button></div></div><div id="admin-gallery-posts" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3"></div></div>
    </section>

    <section data-admin-panel="control" class="admin-panel hidden"><div class="glass-panel rounded-[2rem] p-5 sm:p-7"><div class="flex items-start justify-between gap-4 mb-6"><div><h2 class="text-2xl font-bold">Control Panel</h2><p class="text-sm text-on-surface-variant mt-1">프로젝트의 기능을 즉시 켜고 끕니다.</p></div><div class="icon-glass w-12 h-12 rounded-full flex items-center justify-center text-primary"><i class="fa-solid fa-power-off"></i></div></div><div id="admin-feature-groups" class="grid grid-cols-1 lg:grid-cols-2 gap-5"></div></div></section>

    <section data-admin-panel="member" class="admin-panel hidden"><div class="glass-panel rounded-[2rem] p-4 sm:p-6"><div class="flex flex-wrap gap-3 justify-between items-center mb-5"><div><h2 class="text-2xl font-bold">Member</h2><p class="text-sm text-on-surface-variant">회원 정보, 권한, 상태를 관리합니다.</p></div><div class="glass-input rounded-full px-4 py-2 flex items-center gap-2"><i class="fa-solid fa-magnifying-glass text-xs"></i><input id="admin-member-search" class="border-0 bg-transparent p-0 text-sm focus:ring-0 w-44" placeholder="이름 또는 아이디"></div></div><div id="admin-member-list" class="flex flex-col gap-3"></div></div></section>

    <section data-admin-panel="dashboard" class="admin-panel hidden"><div class="flex flex-wrap items-end justify-between gap-4 mb-5"><div><h2 class="text-2xl font-bold">Dashboard</h2><p class="text-sm text-on-surface-variant">학생별 인증 현황과 후속 조치를 한 화면에서 관리합니다.</p></div><label class="text-xs text-on-surface-variant">기준일<input id="admin-dashboard-date" type="date" value="2026-08-10" min="2026-08-10" max="2026-09-06" class="glass-input rounded-xl px-3 py-2 text-sm block mt-1"></label></div><div id="admin-dashboard-summary" class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5"></div><div class="glass-panel rounded-[2rem] p-4 sm:p-6 overflow-x-auto"><div id="admin-dashboard-list" class="min-w-[860px]"></div></div></section>
  </div>

  <div id="admin-member-modal" class="hidden fixed inset-0 z-[80] items-center justify-center p-4"><div class="absolute inset-0 bg-on-surface/35 backdrop-blur-sm" data-close-modal></div><form id="admin-member-form" class="glass-panel relative rounded-[2rem] p-6 w-full max-w-lg flex flex-col gap-3"><div class="flex justify-between items-center"><h2 class="text-xl font-bold">Edit Member</h2><button type="button" data-close-modal class="icon-glass w-9 h-9 rounded-full"><i class="fa-solid fa-xmark"></i></button></div><input id="admin-member-id" type="hidden"><div class="grid grid-cols-2 gap-3"><label class="text-xs">이름<input id="admin-member-name" class="glass-input rounded-xl p-2 w-full mt-1"></label><label class="text-xs">학년/반<input id="admin-member-grade" class="glass-input rounded-xl p-2 w-full mt-1"></label></div><label class="text-xs">본인 연락처<input id="admin-member-phone" class="glass-input rounded-xl p-2 w-full mt-1"></label><label class="text-xs">학부모 연락처<input id="admin-member-parent-phone" class="glass-input rounded-xl p-2 w-full mt-1" placeholder="나중에 SMS 발송에 사용"></label><label class="text-xs">권한<select id="admin-member-role" class="glass-input rounded-xl p-2 w-full mt-1"><option value="student">Student</option><option value="teacher">Teacher</option><option value="admin">Admin</option></select></label><div class="grid grid-cols-2 gap-3"><label class="glass-card rounded-xl p-3 flex justify-between text-sm">Host <input id="admin-member-host" type="checkbox" class="rounded text-primary"></label><label class="glass-card rounded-xl p-3 flex justify-between text-sm">Active <input id="admin-member-active" type="checkbox" class="rounded text-primary"></label></div><div class="flex gap-2 mt-2"><button class="pill-btn-primary flex-1 py-2.5">저장</button><button id="admin-member-delete" type="button" class="glass-card rounded-full px-5 text-error">강제 탈퇴</button></div></form></div>

  <div id="admin-report-modal" class="hidden fixed inset-0 z-[85] items-center justify-center p-4"><div class="absolute inset-0 bg-on-surface/40 backdrop-blur-sm" data-close-report></div><div class="relative w-full max-w-3xl max-h-[90vh] overflow-y-auto scrollbar-hide"><div id="admin-report-card" class="bg-[#fcf9f8] rounded-[2rem] p-7 sm:p-10 text-on-surface"></div><div class="flex justify-center gap-3 mt-4"><button id="admin-report-copy" class="pill-btn-primary px-6 py-3 text-sm"><i class="fa-regular fa-copy mr-2"></i>이미지 복사</button><button data-close-report class="glass-card rounded-full px-6 py-3 text-sm">닫기</button></div></div></div>
</template>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/auth-guard.js"></script>
<script src="assets/js/auth.js?v=6"></script>
<script src="assets/js/layout.js?v=12"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="assets/js/admin.js?v=5"></script>
<script>document.addEventListener('DOMContentLoaded', async () => { if (await requireAuth()) renderApp({ activePage: 'admin' }); });</script>
</body>
</html>
