<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - SAP 1기</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="assets/js/tailwind-config.js"></script>
<link href="assets/css/app.css" rel="stylesheet">
</head>
<body class="text-on-surface">
<div id="app"></div>
<template id="page-content">
  <p id="admin-status" class="hidden text-sm mb-4"></p>
  <div id="admin-access-denied" class="hidden glass-panel rounded-[2rem] p-12 text-center"><i class="fa-solid fa-lock text-3xl text-error mb-3"></i><p class="font-bold">관리자 권한이 필요합니다.</p></div>
  <div id="admin-content" class="hidden mb-16">
    <section data-admin-panel="board" class="admin-panel">
      <div class="flex flex-wrap items-end justify-between gap-3 mb-8 lg:mb-10">
        <div><h2 class="text-3xl lg:text-4xl font-bold tracking-tight">Board</h2></div>
        <div class="flex items-center gap-2 text-[11px] text-on-surface-variant">
          <span class="relative flex h-2.5 w-2.5"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-quaternary-container opacity-75"></span><span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-quaternary"></span></span>
          <span id="home-last-refreshed">실시간 집계</span>
        </div>
      </div>
      <section class="glass-panel rounded-[2rem] p-6 sm:p-8 mb-6 overflow-hidden relative">
        <div class="absolute -right-8 -top-8 w-36 h-36 rounded-full bg-secondary-container/30 blur-2xl"></div>
        <div class="relative">
          <p id="home-verse-reference" class="text-xs font-bold text-secondary mb-3">오늘의 말씀</p>
          <blockquote id="home-verse-text" class="text-xl sm:text-2xl font-semibold leading-relaxed max-w-3xl">관리자가 등록한 성경구절이 여기에 표시됩니다.</blockquote>
        </div>
      </section>
      <section class="mb-8">
        <div class="flex items-center gap-2 mb-3">
          <h3 class="text-lg font-bold">Board</h3>
          <i class="fa-solid fa-bullhorn text-primary text-sm"></i>
        </div>
        <div id="home-message-list" class="flex flex-col gap-3"></div>
      </section>
    </section>

    <section data-admin-panel="board-manage" class="admin-panel hidden grid grid-cols-1 xl:grid-cols-2 gap-6">
      <section class="glass-panel rounded-[2rem] p-6">
      <h2 class="text-xl font-bold mb-1">Board Message</h2><p class="text-xs text-on-surface-variant mb-5">전체 또는 한 명에게만 보이는 Board Message를 전송합니다.</p>
      <form id="admin-message-form" class="flex flex-col gap-3 mb-6">
        <fieldset><legend class="text-xs font-bold text-on-surface-variant mb-2">메시지 유형</legend><div class="grid grid-cols-2 gap-2"><label class="glass-card rounded-2xl px-4 py-3 flex items-center gap-2 cursor-pointer"><input type="radio" name="admin-message-audience" value="global" class="text-primary" checked><span class="text-sm font-bold"><i class="fa-solid fa-bullhorn text-primary mr-1.5"></i>전체 공지</span></label><label class="glass-card rounded-2xl px-4 py-3 flex items-center gap-2 cursor-pointer"><input type="radio" name="admin-message-audience" value="personal" class="text-secondary"><span class="text-sm font-bold"><i class="fa-solid fa-user text-secondary mr-1.5"></i>개인 메시지</span></label></div></fieldset>
        <label id="admin-message-recipient-wrap" class="hidden text-xs text-on-surface-variant">받는 사람<select id="admin-message-recipient" class="glass-input rounded-2xl px-4 py-2 text-sm w-full mt-1"></select></label>
        <textarea id="admin-message-body" class="glass-input rounded-2xl px-4 py-3 text-sm min-h-28" maxlength="500" placeholder="전달할 메시지" required></textarea>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3"><label class="text-xs text-on-surface-variant">시작 시각 <span class="text-primary">· 문자 예약 발송</span><input id="admin-message-starts" type="datetime-local" class="glass-input rounded-xl px-3 py-2 text-sm w-full mt-1" required></label><label class="text-xs text-on-surface-variant">종료 시각(선택)<input id="admin-message-expires" type="datetime-local" class="glass-input rounded-xl px-3 py-2 text-sm w-full mt-1"></label></div>
        <fieldset><legend class="text-xs font-bold text-on-surface-variant mb-2">발신자</legend><div id="admin-message-senders" class="grid grid-cols-1 sm:grid-cols-2 gap-2"><p class="text-xs text-on-surface-variant">관리자 목록을 불러오는 중...</p></div><p class="text-[10px] text-on-surface-variant mt-2">문자 마지막에 “-선택한 관리자 이름 선생님-”으로 표시됩니다.</p></fieldset>
        <div class="flex gap-2">
          <button id="admin-message-submit" class="pill-btn-primary py-2.5 text-sm flex-1" type="submit">Board Message 전송</button>
          <button id="admin-message-edit-cancel" class="hidden glass-card rounded-full px-5 py-2.5 text-sm text-on-surface-variant" type="button">취소</button>
        </div>
      </form>
      <div class="flex items-center justify-between gap-3 mb-4">
        <div id="admin-message-history-tabs" class="glass-card rounded-full p-1 grid grid-cols-2 text-xs font-bold flex-1" role="tablist" aria-label="Board Message 이력 유형">
          <button type="button" data-message-history-filter="global" class="rounded-full px-3 py-2 nav-pill-active" role="tab">전체 공지</button>
          <button type="button" data-message-history-filter="personal" class="rounded-full px-3 py-2 text-on-surface-variant" role="tab">개인 공지</button>
        </div>
        <span id="admin-message-history-count" class="text-[11px] text-on-surface-variant whitespace-nowrap"></span>
      </div>
      <div id="admin-message-list" class="flex flex-col gap-3"></div>
      <nav id="admin-message-pagination" class="flex items-center justify-center gap-3 mt-5" aria-label="Board Message 이력 페이지"></nav>
      </section><section class="glass-panel rounded-[2rem] p-6">
      <h2 class="text-xl font-bold mb-5">Home 상단에 게시할 말씀입니다</h2>
      <form id="admin-verse-form" class="flex flex-col gap-3 mb-6">
        <input id="admin-verse-reference" class="glass-input rounded-2xl px-4 py-2 text-sm" maxlength="100" placeholder="예: 빌립보서 4:13" required>
        <textarea id="admin-verse-text" class="glass-input rounded-2xl px-4 py-3 text-sm min-h-28" maxlength="1000" placeholder="성경구절 본문" required></textarea>
        <button class="pill-btn-primary py-2.5 text-sm" type="submit">말씀 등록</button>
      </form>
      <div id="admin-verse-list" class="flex flex-col gap-3"></div>
      </section>
    </section>

    <section data-admin-panel="gallery" class="admin-panel hidden">
      <div class="flex flex-wrap items-end justify-between gap-4 mb-6"><h2 class="text-3xl lg:text-4xl font-bold tracking-tight">Gallery</h2><p class="text-xs text-on-surface-variant">2026.08.10 – 09.06 · Weekdays</p></div>
      <section class="glass-panel rounded-[2rem] p-4 sm:p-5 mb-6 relative z-50 overflow-visible"><div class="flex items-center gap-3"><button id="gallery-prev-day" type="button" class="icon-glass w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0" aria-label="이전 날짜"><i class="fa-solid fa-chevron-left"></i></button><div class="flex-1 min-w-0 text-center relative"><p id="gallery-day-count" class="text-[11px] font-bold text-primary mb-1">DAY 1 / 20</p><button id="gallery-calendar-toggle" type="button" class="glass-input rounded-xl px-4 py-2 text-sm font-semibold w-full max-w-[220px] mx-auto flex items-center justify-center gap-2" aria-haspopup="dialog" aria-expanded="false"><i class="fa-regular fa-calendar"></i><span id="gallery-date-display">2026-08-10</span></button><p id="gallery-date-label" class="text-xs text-on-surface-variant mt-1"></p><div id="gallery-calendar-popover" style="background-color:#ffffff" class="hidden absolute z-[70] top-full left-1/2 -translate-x-1/2 mt-3 w-[min(92vw,560px)] rounded-[1.5rem] border border-outline-variant p-4 text-left shadow-xl"><div id="gallery-calendar-months"></div></div></div><button id="gallery-next-day" type="button" class="icon-glass w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0" aria-label="다음 날짜"><i class="fa-solid fa-chevron-right"></i></button></div></section>
      <div class="glass-panel rounded-full p-1 flex w-fit mx-auto mb-5 text-sm font-semibold" id="gallery-type-tabs"><button id="gallery-type-word" type="button" data-gallery-type-tab="word" class="nav-pill-active rounded-full px-5 py-2 transition-colors"><i class="fa-solid fa-book-bible mr-1.5"></i>말씀묵상</button><button id="gallery-type-pray" type="button" data-gallery-type-tab="pray" class="text-on-surface-variant rounded-full px-5 py-2 transition-colors"><i class="fa-solid fa-hands-praying mr-1.5"></i>기도</button></div>
      <section class="mb-7"><div id="gallery-active-grid" class="gallery-swipe-grid"></div></section><nav id="gallery-pagination" class="flex items-center justify-center gap-2 pb-16" aria-label="학생 갤러리 페이지"></nav>
    </section>

    <section data-admin-panel="comment" class="admin-panel hidden">
      <div class="flex flex-wrap items-end justify-between gap-4 mb-6"><h2 class="text-3xl lg:text-4xl font-bold tracking-tight">Comment</h2><p class="text-xs text-on-surface-variant">말씀 묵상 게시물에 날짜별로 댓글을 남깁니다.</p></div>
      <div class="glass-panel rounded-full p-1 flex w-fit mx-auto mb-5 text-sm font-semibold" id="comment-view-tabs">
        <button id="comment-view-list" type="button" data-comment-view-tab="list" class="nav-pill-active rounded-full px-5 py-2 transition-colors"><i class="fa-solid fa-list mr-1.5"></i>List</button>
        <button id="comment-view-table" type="button" data-comment-view-tab="table" class="text-on-surface-variant rounded-full px-5 py-2 transition-colors"><i class="fa-solid fa-table-cells mr-1.5"></i>Table</button>
      </div>

      <div id="comment-list-view">
        <section class="glass-panel rounded-[2rem] p-4 sm:p-5 mb-6">
          <div class="flex items-center gap-3">
            <button id="comment-prev-day" type="button" class="icon-glass w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0" aria-label="이전 날짜"><i class="fa-solid fa-chevron-left"></i></button>
            <div class="flex-1 min-w-0 text-center">
              <p id="comment-day-count" class="text-[11px] font-bold text-primary mb-1">DAY 1 / 20</p>
              <select id="comment-day-select" class="glass-input rounded-xl px-4 py-2 text-sm font-semibold w-full max-w-[320px] mx-auto"></select>
            </div>
            <button id="comment-next-day" type="button" class="icon-glass w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0" aria-label="다음 날짜"><i class="fa-solid fa-chevron-right"></i></button>
          </div>
        </section>
        <div id="comment-list" class="flex flex-col gap-3 mb-5"></div>
        <nav id="comment-pagination" class="flex items-center justify-center gap-2 pb-16" aria-label="Comment 페이지"></nav>
      </div>

      <div id="comment-table-view" class="hidden">
        <section class="glass-panel rounded-[2rem] p-4 sm:p-6 mb-16">
          <p class="text-xs text-on-surface-variant mb-4">행: 학생, 열: 운영기간 — 말씀 묵상 게시물에 댓글을 달았는지 한눈에 봅니다. 안 단 칸을 누르면 해당 날짜로 이동해서 바로 댓글을 달 수 있어요.</p>
          <div class="overflow-auto max-h-[70vh] rounded-2xl border border-outline-variant/40">
            <div id="comment-table"></div>
          </div>
        </section>
      </div>
    </section>

    <section data-admin-panel="control" class="admin-panel hidden">
      <div class="glass-panel rounded-[2rem] p-5 sm:p-7"><div class="flex items-start justify-between gap-4 mb-6"><div><h2 class="text-2xl font-bold">Control Panel</h2><p class="text-sm text-on-surface-variant mt-1">이용자가 보는 탭과 탭 안의 세부 기능을 제어합니다.</p></div><div class="icon-glass w-12 h-12 rounded-full flex items-center justify-center text-primary"><i class="fa-solid fa-power-off"></i></div></div><div id="admin-feature-groups" class="flex flex-col gap-5"></div></div>
      <div class="glass-panel rounded-[2rem] p-5 sm:p-7 mt-6">
        <div class="flex items-start justify-between gap-4 mb-5"><div><h2 class="text-lg font-bold">Gallery 댓글 작성 권한</h2><p class="text-sm text-on-surface-variant mt-1">호스트 여부와 관계없이, 아래에서 체크한 권한을 가진 계정만 Gallery에 댓글을 작성할 수 있습니다.</p></div><div class="icon-glass w-11 h-11 rounded-full flex items-center justify-center text-primary flex-shrink-0"><i class="fa-regular fa-comment"></i></div></div>
        <div id="admin-comment-roles" class="flex flex-wrap gap-2"></div>
      </div>
    </section>

    <section data-admin-panel="member" class="admin-panel hidden"><div class="glass-panel rounded-[2rem] p-4 sm:p-6"><div class="flex flex-wrap gap-3 justify-between items-center mb-5"><div><h2 class="text-2xl font-bold">Member</h2><p class="text-sm text-on-surface-variant">회원 정보, 권한, 상태를 관리합니다.</p></div><div class="glass-input rounded-full px-4 py-2 flex items-center gap-2"><i class="fa-solid fa-magnifying-glass text-xs"></i><input id="admin-member-search" class="border-0 bg-transparent p-0 text-sm focus:ring-0 w-44" placeholder="이름 또는 아이디"></div></div><div id="admin-member-list" class="flex flex-col gap-3"></div></div></section>

    <section data-admin-panel="dashboard" class="admin-panel hidden">
      <div class="flex justify-end mb-5"><label class="text-xs text-on-surface-variant">기준일<input id="admin-dashboard-date" type="date" value="2026-08-10" min="2026-08-10" max="2026-09-06" class="glass-input rounded-xl px-3 py-2 text-sm block mt-1"></label></div>
      <div id="admin-dashboard-summary" class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5"></div>
      <div class="glass-panel rounded-[2rem] p-4 sm:p-6 mb-5">
        <div class="flex flex-wrap items-center gap-2 mb-5"><button id="admin-dashboard-bulk-report" type="button" class="rounded-full bg-emerald-500 hover:bg-emerald-600 text-white px-5 py-2.5 text-sm font-bold shadow-lg shadow-emerald-200 disabled:opacity-40 disabled:cursor-not-allowed"><i class="fa-solid fa-file-arrow-up mr-2"></i>학부모 리포트 일괄 발송</button><button id="admin-dashboard-bulk-sms" type="button" class="rounded-full bg-sky-500 hover:bg-sky-600 text-white px-5 py-2.5 text-sm font-bold shadow-lg shadow-sky-200 disabled:opacity-40 disabled:cursor-not-allowed"><i class="fa-solid fa-paper-plane mr-2"></i>미인증 내역 알림 문자 발송</button><button id="admin-dashboard-export-excel" type="button" class="rounded-full bg-violet-500 hover:bg-violet-600 text-white px-5 py-2.5 text-sm font-bold shadow-lg shadow-violet-200 disabled:opacity-40 disabled:cursor-not-allowed"><i class="fa-solid fa-file-excel mr-2"></i>리포트 링크 엑셀로 내보내기</button></div>
        <div class="overflow-x-auto"><div id="admin-dashboard-list" class="min-w-[1100px]"></div></div>
        <div id="admin-dashboard-pagination" class="flex flex-wrap items-center justify-center gap-2 mt-5"></div>
      </div>
      <section class="glass-panel rounded-[2rem] p-4 sm:p-6">
        <div class="flex items-center justify-between gap-3 mb-4"><div><h3 class="text-lg font-bold">문자 발송 현황</h3><p class="text-xs text-on-surface-variant mt-1">최근 발송 결과를 확인합니다.</p></div><button id="admin-sms-log-refresh" type="button" class="icon-glass w-9 h-9 rounded-full text-sky-500" aria-label="발송 현황 새로고침"><i class="fa-solid fa-rotate"></i></button></div>
        <div id="admin-sms-log-list" class="flex flex-col gap-2"></div>
      </section>
    </section>

    <section data-admin-panel="stat" class="admin-panel hidden">
      <section class="glass-panel rounded-[2rem] p-4 sm:p-6">
        <div class="flex flex-wrap items-center gap-3 mb-5">
          <div class="glass-input rounded-full px-4 py-2 flex items-center gap-2"><i class="fa-solid fa-magnifying-glass text-xs"></i><input id="admin-stat-search" class="border-0 bg-transparent p-0 text-sm focus:ring-0 w-44" placeholder="이름 또는 아이디"></div>
          <select id="admin-stat-role" class="glass-input rounded-full px-4 py-2 text-sm"><option value="student" selected>학생</option><option value="teacher">교사</option><option value="pastor">목사님</option><option value="department_head">부장님</option><option value="secretary">총무님</option><option value="admin">Admin</option><option value="all">전체 권한</option></select>
          <button id="admin-stat-refresh" type="button" class="icon-glass w-10 h-10 rounded-full text-primary" aria-label="통계 새로고침"><i class="fa-solid fa-rotate text-sm"></i></button>
        </div>
        <div class="overflow-x-auto"><div id="admin-stat-list" class="min-w-[900px]"></div></div>
      </section>
    </section>
  </div>

  <div id="admin-member-modal" class="hidden fixed inset-0 z-[80] items-center justify-center p-4"><div class="absolute inset-0 bg-on-surface/35 backdrop-blur-sm" data-close-modal></div><form id="admin-member-form" class="glass-panel relative rounded-[2rem] p-6 w-full max-w-lg flex flex-col gap-3"><div class="flex justify-between items-center"><h2 class="text-xl font-bold">Edit Member</h2><button type="button" data-close-modal class="icon-glass w-9 h-9 rounded-full"><i class="fa-solid fa-xmark"></i></button></div><input id="admin-member-id" type="hidden"><div class="grid grid-cols-2 gap-3"><label class="text-xs">이름<input id="admin-member-name" class="glass-input rounded-xl p-2 w-full mt-1"></label><label class="text-xs">학년/반<input id="admin-member-grade" class="glass-input rounded-xl p-2 w-full mt-1"></label></div><label class="text-xs">학생 전화번호<input id="admin-member-phone" class="glass-input rounded-xl p-2 w-full mt-1"></label><label class="text-xs">학부모 전화번호<input id="admin-member-parent-phone" class="glass-input rounded-xl p-2 w-full mt-1" placeholder="리포트 및 안내 문자 발송에 사용"></label><label class="text-xs">권한<select id="admin-member-role" class="glass-input rounded-xl p-2 w-full mt-1"><option value="student">Student</option><option value="teacher">Teacher</option><option value="admin">Admin</option></select></label><div class="grid grid-cols-2 gap-3"><label class="glass-card rounded-xl p-3 flex justify-between text-sm">Host <input id="admin-member-host" type="checkbox" class="rounded text-primary"></label><label class="glass-card rounded-xl p-3 flex justify-between text-sm">Active <input id="admin-member-active" type="checkbox" class="rounded text-primary"></label></div><div class="flex gap-2 mt-2"><button class="pill-btn-primary flex-1 py-2.5">저장</button><button id="admin-member-delete" type="button" class="glass-card rounded-full px-5 text-error">강제 탈퇴</button></div></form></div>


  <div id="comment-profile-modal" class="hidden fixed inset-0 z-[85] items-end sm:items-center justify-center sm:p-4" role="dialog" aria-modal="true" aria-labelledby="comment-profile-name">
    <div id="comment-profile-overlay" class="absolute inset-0 bg-on-surface/35 backdrop-blur-sm"></div>
    <section class="relative w-full sm:max-w-2xl h-[94vh] sm:h-[88vh] bg-white rounded-t-[2rem] sm:rounded-[2rem] shadow-2xl flex flex-col overflow-hidden">
      <header class="flex items-center justify-between px-5 py-3.5 border-b border-outline-variant flex-shrink-0">
        <button id="comment-profile-back" type="button" class="icon-glass w-9 h-9 rounded-full flex items-center justify-center" aria-label="프로필 닫기"><i class="fa-solid fa-chevron-left"></i></button>
        <p class="text-sm font-bold">Profile</p>
        <button id="comment-profile-close" type="button" class="icon-glass w-9 h-9 rounded-full flex items-center justify-center" aria-label="프로필 닫기"><i class="fa-solid fa-xmark"></i></button>
      </header>
      <div id="comment-profile-content" class="flex-1 min-h-0 overflow-y-auto bg-surface-lowest scrollbar-hide"></div>
