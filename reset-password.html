<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비밀번호 재설정 - SAP 1기</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="assets/js/tailwind-config.js"></script>
<link href="assets/css/app.css" rel="stylesheet">
</head>
<body class="text-on-surface h-screen flex items-center justify-center px-4">
<div class="mesh-bg"></div>
<div class="w-full max-w-sm glass-panel rounded-[2rem] p-8">
  <div class="text-center mb-8">
    <div class="w-10 h-10 bg-gradient-to-br from-primary to-tertiary text-on-primary rounded-full text-sm flex items-center justify-center font-bold mx-auto mb-4">S</div>
    <h1 class="text-2xl font-bold tracking-tight">새 비밀번호 설정</h1>
    <p class="text-sm text-on-surface-variant mt-2">새로 사용할 비밀번호를 입력하세요.</p>
  </div>

  <form id="reset-form" class="flex flex-col gap-3">
    <input
      type="password"
      id="password-input"
      required
      autocomplete="new-password"
      placeholder="새 비밀번호"
      class="glass-input w-full px-4 py-2.5 rounded-2xl text-sm"
    >
    <input
      type="password"
      id="password-confirm-input"
      required
      autocomplete="new-password"
      placeholder="새 비밀번호 확인"
      class="glass-input w-full px-4 py-2.5 rounded-2xl text-sm"
    >
    <p id="password-match-hint" class="text-xs hidden text-error">비밀번호가 일치하지 않습니다.</p>
    <button
      type="submit"
      id="reset-submit"
      class="pill-btn-primary w-full text-sm px-4 py-2.5"
    >
      비밀번호 변경
    </button>
  </form>

  <p id="reset-status" class="text-sm text-center mt-4 hidden"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script>
  const form = document.getElementById('reset-form');
  const passwordInput = document.getElementById('password-input');
  const passwordConfirmInput = document.getElementById('password-confirm-input');
  const passwordMatchHint = document.getElementById('password-match-hint');
  const submitBtn = document.getElementById('reset-submit');
  const status = document.getElementById('reset-status');

  function showStatus(message, isError) {
    status.textContent = message;
    status.classList.remove('hidden', 'text-error', 'text-on-surface-variant');
    status.classList.add(isError ? 'text-error' : 'text-on-surface-variant');
  }

  let hasRecoverySession = false;
  if (window.supabaseClient) {
    window.supabaseClient.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY') hasRecoverySession = true;
    });
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    passwordMatchHint.classList.add('hidden');

    if (passwordInput.value !== passwordConfirmInput.value) {
      passwordMatchHint.classList.remove('hidden');
      return;
    }

    if (!window.supabaseClient) {
      showStatus('Supabase 설정이 없습니다. assets/config.example.js를 assets/config.js로 복사하고 값을 채워주세요.', true);
      return;
    }

    const { data: { session } } = await window.supabaseClient.auth.getSession();
    if (!session && !hasRecoverySession) {
      showStatus('링크가 만료되었거나 올바르지 않습니다. 비밀번호 찾기를 다시 시도해주세요.', true);
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = '변경 중...';

    const { error } = await window.supabaseClient.auth.updateUser({ password: passwordInput.value });

    submitBtn.disabled = false;
    submitBtn.textContent = '비밀번호 변경';

    if (error) {
      showStatus(error.message, true);
      return;
    }

    showStatus('비밀번호가 변경되었습니다. 다시 로그인해주세요.', false);
    await window.supabaseClient.auth.signOut();
    setTimeout(() => { window.location.href = 'login.html'; }, 1500);
  });
</script>
</body>
</html>
