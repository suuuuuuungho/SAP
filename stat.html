<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stat - SAP 1기</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="assets/js/tailwind-config.js"></script>
<link href="assets/css/app.css" rel="stylesheet">
</head>
<body class="text-on-surface">
<div id="app"></div>
<template id="page-content">
  <!-- Header -->
  <div class="flex flex-wrap items-center justify-end gap-3 mb-8 lg:mb-10">
    <div class="glass-panel rounded-full p-1 flex text-sm font-semibold">
      <button type="button" id="stat-range-weekly" class="px-3.5 py-1.5 rounded-full nav-pill-active transition-colors">이번 주</button>
      <button type="button" id="stat-range-monthly" class="px-3.5 py-1.5 rounded-full text-on-surface-variant transition-colors">이번 달</button>
      <button type="button" id="stat-range-all" class="px-3.5 py-1.5 rounded-full text-on-surface-variant transition-colors">전체 기간</button>
    </div>
  </div>

  <!-- 스트릭 + 범위 목표 링 -->
  <section class="grid grid-cols-1 sm:grid-cols-2 gap-4 lg:gap-6 mb-6">
    <div class="glass-card rounded-[1.5rem] p-6 flex flex-col">
      <p class="text-sm font-bold text-on-surface-variant mb-4">연속적으로 300분을 달성한 일 수</p>
      <div class="flex-1 flex flex-col items-center justify-center text-center">
        <i class="fa-solid fa-fire text-7xl text-tertiary streak-flame"></i>
        <p id="stat-streak-current" class="text-4xl font-bold text-primary mt-3">0일</p>
        <p id="stat-streak-longest" class="text-sm text-on-surface-variant mt-1">최장 0일</p>
      </div>
    </div>

    <div class="glass-card rounded-[1.5rem] p-6">
      <p class="text-sm font-bold text-on-surface-variant mb-4">하루 300분 목표를 달성한 날의 비율</p>
      <div class="relative w-36 h-36 mx-auto">
        <svg viewBox="0 0 120 120" class="w-full h-full -rotate-90">
          <circle cx="60" cy="60" r="52" fill="none" stroke-width="12" class="stroke-surface-highest"></circle>
          <circle id="stat-goal-ring" cx="60" cy="60" r="52" fill="none" stroke-width="12" stroke-linecap="round" stroke="url(#stat-goal-gradient-low)"></circle>
          <defs>
            <linearGradient id="stat-goal-gradient-low" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#aa3524"></stop>
              <stop offset="100%" stop-color="#ee6650"></stop>
            </linearGradient>
            <linearGradient id="stat-goal-gradient-high" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ff4b91"></stop>
              <stop offset="100%" stop-color="#6e4f9c"></stop>
            </linearGradient>
          </defs>
        </svg>
        <div class="absolute inset-0 flex flex-col items-center justify-center">
          <p id="stat-goal-percent" class="text-3xl font-bold text-on-surface">0%</p>
        </div>
      </div>
      <p id="stat-goal-sub" class="text-center text-xs text-on-surface-variant mt-4">0/0 days hit goal</p>
    </div>
  </section>

  <!-- KPI 타일 -->
  <section class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
    <div class="glass-card rounded-[1.5rem] p-4">
      <p class="text-xs font-bold text-on-surface-variant mb-1">누적 시간</p>
      <p id="stat-kpi-total" class="text-2xl font-bold text-primary">0분</p>
    </div>
    <div class="glass-card rounded-[1.5rem] p-4">
      <p class="text-xs font-bold text-on-surface-variant mb-1">하루 평균</p>
      <p id="stat-kpi-avg" class="text-2xl font-bold text-primary">0분</p>
    </div>
    <div class="glass-card rounded-[1.5rem] p-4">
      <p class="text-xs font-bold text-on-surface-variant mb-1">달성 일수</p>
      <p id="stat-kpi-completed" class="text-2xl font-bold text-primary">0 / 0일</p>
    </div>
    <div class="glass-card rounded-[1.5rem] p-4">
      <p class="text-xs font-bold text-on-surface-variant mb-1">최고기록</p>
      <p id="stat-kpi-best" class="text-2xl font-bold text-primary">-</p>
    </div>
  </section>

  <!-- 완료 히트맵 -->
  <section class="glass-card rounded-[1.5rem] p-6 mb-6">
    <div class="flex flex-wrap items-center justify-between gap-3 mb-1">
      <div id="stat-heatmap-metric-tabs" class="glass-panel rounded-full p-1 flex text-xs font-semibold">
        <button type="button" data-metric="completed" class="px-2.5 py-1 rounded-full nav-pill-active transition-colors">완료</button>
        <button type="button" data-metric="pray" class="px-2.5 py-1 rounded-full text-on-surface-variant transition-colors">기도</button>
        <button type="button" data-metric="word" class="px-2.5 py-1 rounded-full text-on-surface-variant transition-colors">말씀</button>
        <button type="button" data-metric="study" class="px-2.5 py-1 rounded-full text-on-surface-variant transition-colors">공부</button>
        <button type="button" data-metric="worship" class="px-2.5 py-1 rounded-full text-on-surface-variant transition-colors">예배</button>
      </div>
    </div>
    <div class="max-w-xs">
      <div class="grid grid-cols-5 gap-1 mb-1">
        <span class="text-[9px] text-on-surface-variant text-center">Mon</span>
        <span class="text-[9px] text-on-surface-variant text-center">Tue</span>
        <span class="text-[9px] text-on-surface-variant text-center">Wed</span>
        <span class="text-[9px] text-on-surface-variant text-center">Thu</span>
        <span class="text-[9px] text-on-surface-variant text-center">Fri</span>
      </div>
      <div id="stat-heatmap" class="flex flex-col gap-1"></div>
    </div>
    <p id="stat-heatmap-detail" class="text-xs text-on-surface-variant mt-3 h-4">칸에 커서를 올리거나 눌러보세요</p>
  </section>

  <!-- 추세 라인 -->
  <section class="glass-card rounded-[1.5rem] p-6 mb-6">
    <p class="text-sm font-bold text-on-surface-variant mb-4">활동 시간 추이</p>
    <div class="relative h-56 sm:h-64 lg:h-72">
      <canvas id="stat-trend-chart"></canvas>
    </div>
  </section>

  <!-- 밸런스 레이더 + 시간 배분 도넛 -->
  <section class="grid grid-cols-1 lg:grid-cols-2 gap-4 lg:gap-6 mb-6">
    <div class="glass-card rounded-[1.5rem] p-6">
      <p class="text-sm font-bold text-on-surface-variant mb-4">카테고리별 하루 평균 시간</p>
      <div class="relative h-64">
        <canvas id="stat-radar-chart"></canvas>
      </div>
    </div>
    <div class="glass-card rounded-[1.5rem] p-6">
      <p class="text-sm font-bold text-on-surface-variant mb-4">카테고리별 시간 비중</p>
      <div class="relative h-64">
        <canvas id="stat-donut-chart"></canvas>
      </div>
    </div>
  </section>

  <!-- 퍼스널 베스트 -->
  <section class="mb-6">
    <p class="text-sm font-bold text-on-surface-variant mb-3">지금까지의 최고 기록들</p>
    <div id="stat-best-chips" class="flex flex-wrap gap-3"></div>
  </section>

  <!-- 단어 시험 점수 -->
  <section class="mb-16">
    <p class="text-sm font-bold text-on-surface-variant mb-3">단어 시험 점수</p>
    <div id="stat-word-exam-list" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
  </section>
</template>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/auth-guard.js"></script>
<script src="assets/js/auth.js?v=10"></script>
<script src="assets/js/layout.js?v=24"></script>
<script src="assets/js/pray-word.js?v=19"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="assets/js/stat.js?v=14"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    if (await requireAuth()) renderApp({ activePage: 'stat' });
  });
</script>
</body>
</html>
